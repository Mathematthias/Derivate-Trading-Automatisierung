name: Marketdata Sync Tier A

# Sync-Schedule für Tier A (Indizes/Rohstoffe/Krypto/Positionen/Watchlist):
#   - Alle 30 Min während Xetra-Handelszeit Mo-Fr (08:00-22:00 CET)
#   - Cron läuft in UTC, nicht in CET — Mo-Fr 06:00-20:00 UTC = Mo-Fr 08:00-22:00 CET
#   - Sa 10:00 CET = Sa 09:00 UTC (für Wochenend-Snapshot)

on:
  schedule:
    # Mo-Fr alle 30 Min zwischen 06:00 und 20:00 UTC
    - cron: '0,30 6-20 * * 1-5'
    # Sa 09:00 UTC
    - cron: '0 9 * * 6'
  # Manueller Trigger zum Testen
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: marketdata-pipeline/marketdata-pipeline
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        working-directory: marketdata-pipeline/marketdata-pipeline
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          STATE_DOC_ID: 17KgjCjFiy15JsSRD8h_EK5lL_PitkOJIC7ou1LYOcks
          BRIEFING_FOLDER_ID: 1jKuyo12c38sg8Ff4ZHFXHqsU_Nl2D4AA
          MODE: tier_a
          CONFIG_DIR: ./config
          PYTHONPATH: ./src
        run: |
          python src/marketdata_sync.py
