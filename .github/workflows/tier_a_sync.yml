name: Marketdata Sync Tier A

# Trigger-Architektur (seit 2026-04-30):
#   Single Source of Truth ist cron-job.org (externer Cron-Service mit
#   PAT-basiertem workflow_dispatch). GitHub-eigene Schedules wurden wegen
#   Unzuverlässigkeit (verzögertes/ausgelassenes Feuern) deaktiviert.
#   Seit 2026-05-13 zusätzlich Hygiene-Bestätigung: KEIN `on: schedule` —
#   bei öffentlichem Repo zudem unzuverlässig.
#
# Tier-A-Slots in cron-job.org (Berlin-Zeit) — Stand 2026-05-23 (live konfiguriert):
#   - Mo-Fr alle 30 Min, Lauf-Fenster 08:00-22:30  → Crontab: 0,30 8-22 * * 1-5
#   Fenster bis 22:30 (vorher 21:00): deckt die Handelsfenster 09-12 + 19-22
#   ab; die 22:00/22:30-Läufe sitzen post-US-Close und post-Volumen-Guard
#   (20:00 UTC) → finales EOD inkl. volume_zscore/nr7 fürs Morgen-Briefing.
#   Sa-Snapshot (früher 0 10 * * 6) am 2026-05-23 entfernt — am Wochenende
#   kein neuer EOD-Stand gegenüber Freitag, kein Wochenend-Handel.
#
# Da cron-job.org bereits in Berlin-Zeit triggert und nur zur gewünschten
# Zeit feuert, ist das frühere Berlin-Time-Gate obsolet und entfernt. Bei
# Neuinstallation/Migration siehe Memory-Notiz „PAT renewal deadline 2026-07-21".
#
# EMA200-MeanRev + PEAD-Window (seit 2026-05-08, Note #49):
#   - EARNINGS_PULL=1 aktiviert pro-Symbol-Earnings-Pull (yfinance.Ticker.earnings_dates).
#     Bei ~48 Tier-A-Symbolen entstehen ~48 zusätzliche Yahoo-Calls — verkraftbar.
#     Ergibt PEAD-WINDOW-Flag im CANDIDATES.md für Symbole mit Earnings ≤5 HT zurück.
#   - Tier B übernimmt das NICHT (zu viele Symbole, Yahoo-Rate-Limit-Risiko).

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: marketdata-pipeline
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Watchlist from Trading-Journal
        # 2026-05-19 (Note #68): continue-on-error war true und hat einen
        # HTTP-400-Fehler im STATE-Doc-Write maskiert. Pipeline lief danach
        # mit veraltetem STATE weiter (34 statt 51 WL-Einträge), Folge:
        # CHKP-Setup am 18.05. gar nicht erst getriggert. Stille Fails sind
        # teurer als rote Workflows — daher false.
        continue-on-error: false
        working-directory: marketdata-pipeline
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          STATE_DOC_ID: 1ZVmRDY1vQdw_5dv6X7GtqSym5MSnPlvp
          PYTHONPATH: ./src
        run: |
          python src/watchlist_sync.py

      - name: Run pipeline
        working-directory: marketdata-pipeline
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          STATE_DOC_ID: 1ZVmRDY1vQdw_5dv6X7GtqSym5MSnPlvp
          BRIEFING_FOLDER_ID: 1_oQBr6KH7u6FDCAUIs1liTnEFjn-b_Ht
          MODE: tier_a
          CONFIG_DIR: ./config
          PYTHONPATH: ./src
          EARNINGS_PULL: "1"
        run: |
          python src/marketdata_sync.py
