# Fehlte im Repo-Stand vom 2026-09-07 — deshalb sind die beiden roten
# Grinder-Tests seit dem 2026-09-04 niemandem aufgefallen. Ohne diesen Workflow
# ruft KEIN Job pytest auf (Audit-Befund 2026-09-01, seither unveraendert).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml pandas yfinance google-api-python-client google-auth
      - name: Run test suite
        working-directory: marketdata-pipeline
        run: python -m pytest tests/ -q
