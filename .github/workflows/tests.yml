# Ruft die Testsuite auf jedem Push und Pull Request.
#
# Fehlte im Repo-Stand vom 2026-09-07 — deshalb sind zwei rote Grinder-Tests
# seit dem 2026-09-04 niemandem aufgefallen (Audit-Befund 2026-09-01, seither
# unveraendert geblieben).
#
# ⚠️ ABHAENGIGKEITEN KOMMEN AUS requirements.txt, NICHT AUS EINER HANDLISTE.
# Die erste Fassung dieses Workflows zaehlte die Pakete von Hand auf und vergass
# openpyxl, numpy und requests -> "Interrupted: 2 errors during collection",
# Exit 2, bevor ein einziger Test lief. Alle sechs uebrigen Workflows des Repos
# installieren aus requirements.txt; dieser tut es jetzt auch. pytest kommt
# zusaetzlich dazu, weil es keine Laufzeit-Abhaengigkeit ist und deshalb nicht
# in requirements.txt gehoert.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketdata-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: marketdata-pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -q
