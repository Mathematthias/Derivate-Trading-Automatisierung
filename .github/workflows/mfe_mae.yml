name: MFE/MAE (Trade-Audit -> Excursion in R)

# System-Review 2026-10-04: Einstiegs- vs. Ausstiegsfehler lassen sich erst
# trennen, wenn je Trade bekannt ist, wie weit der Basiswert FUER und GEGEN
# die Position gelaufen ist.
#
# Fix 2026-10-08 (MFE_R/MAE_R waren in allen Audit-Zeilen leer):
#   - Eingaben leben jetzt im Repo: marketdata-pipeline/state/trade_audit.csv
#     (TradeID D-0NN/A-0NN, Symbol, Richtung, Kauf, Verkauf, EntryU, SL_U, R).
#     Das Journal braucht der Job nicht mehr.
#   - Ergebnis: state/mfe_mae.csv wird zurueck nach main committet; der
#     Journal-Export im Chat traegt es ins Blatt Trade-Audit ein
#     (mfe_mae.py --merge-journal). Zusaetzlich MFE-MAE-<stamp>.md im Briefing-Ordner.
#   - Laeuft jetzt auch automatisch: samstags 07:15 UTC, plus on demand.
#   - Altmodus (Journal aus Drive) bleibt, wenn trade_audit.csv fehlt.

on:
  schedule:
    - cron: '15 7 * * 6'
  workflow_dispatch:
    inputs:
      journal_file_id:
        description: 'Nur Altmodus: Drive-File-ID des Journals (leer = juengstes). Wird ignoriert, wenn state/trade_audit.csv existiert.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: state-yaml
  cancel-in-progress: false

jobs:
  mfe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: marketdata-pipeline
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute (CSV-Modus aus dem Repo)
        if: hashFiles('marketdata-pipeline/state/trade_audit.csv') != ''
        working-directory: marketdata-pipeline
        env:
          PYTHONPATH: ./src
        run: |
          mkdir -p work
          STAMP=$(date +%Y%m%d-%H%M)
          python src/mfe_mae.py --audit-csv state/trade_audit.csv --results-csv state/mfe_mae.csv \
            --md "work/MFE-MAE-$STAMP.md"

      - name: Commit results
        if: hashFiles('marketdata-pipeline/state/trade_audit.csv') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketdata-pipeline/state/mfe_mae.csv
          git commit -m "state: MFE/MAE neu gerechnet ($(date -u +%Y-%m-%dT%H:%MZ))" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload summary to Drive (CSV-Modus)
        if: hashFiles('marketdata-pipeline/state/trade_audit.csv') != ''
        working-directory: marketdata-pipeline
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          BRIEFING_FOLDER_ID: 1_oQBr6KH7u6FDCAUIs1liTnEFjn-b_Ht
          PYTHONPATH: ./src
        run: |
          python - <<'PY'
          import os, pathlib
          from drive_writer import build_drive_service, write_markdown_file
          svc = build_drive_service(); folder = os.environ["BRIEFING_FOLDER_ID"]
          for p in sorted(pathlib.Path("work").glob("MFE-MAE-*.md")):
              write_markdown_file(svc, folder, p.name, p.read_text(encoding="utf-8"))
          PY

      - name: Altmodus (Journal aus Drive)
        if: hashFiles('marketdata-pipeline/state/trade_audit.csv') == ''
        working-directory: marketdata-pipeline
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          BRIEFING_FOLDER_ID: 1_oQBr6KH7u6FDCAUIs1liTnEFjn-b_Ht
          JOURNAL_FILE_ID: ${{ github.event.inputs.journal_file_id }}
          PYTHONPATH: ./src
        run: |
          python - <<'PY'
          import os, pathlib
          from drive_writer import build_drive_service, download_file_bytes
          from watchlist_sync import find_latest_journal
          svc = build_drive_service()
          fid = os.environ.get("JOURNAL_FILE_ID", "").strip()
          if not fid:
              f = find_latest_journal(svc)
              print("Journal:", f["name"], f["modifiedTime"]); fid = f["id"]
          pathlib.Path("work").mkdir(exist_ok=True)
          pathlib.Path("work/in.xlsx").write_bytes(download_file_bytes(svc, fid))
          PY
          STAMP=$(date +%Y%m%d-%H%M)
          python src/mfe_mae.py --journal work/in.xlsx --csv "work/MFE-MAE-$STAMP.csv" --md "work/MFE-MAE-$STAMP.md"
          python - <<'PY'
          import os, pathlib
          from drive_writer import build_drive_service, write_binary_file, write_markdown_file
          svc = build_drive_service(); folder = os.environ["BRIEFING_FOLDER_ID"]
          for p in sorted(pathlib.Path("work").glob("MFE-MAE-*.csv")):
              write_binary_file(svc, folder, p.name, p.read_bytes(), "text/csv")
          for p in sorted(pathlib.Path("work").glob("MFE-MAE-*.md")):
              write_markdown_file(svc, folder, p.name, p.read_text(encoding="utf-8"))
          PY
