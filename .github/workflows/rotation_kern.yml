name: Kern-Rotation (Monatssignal + taegliche Vorschau)

# Neuaufstellung A+ (User-Entscheid 2026-11-07): Kern ~8.000 EUR in einer ETF-Rotation.
# Laeuft Mo-Fr nach US-Schluss. Am letzten Handelstag des Monats schreibt der Job das Signal
# (Kauf-/Verkaufsliste), sonst nur die Vorschau. Regel und Universum: src/rotation_kern.py,
# config/rotation_kern.yaml. force=true erzwingt ein Signal (z. B. fuer den Erststart).

on:
  schedule:
    - cron: '35 22 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Signal erzwingen (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: state-yaml
  cancel-in-progress: false

jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        working-directory: marketdata-pipeline
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Rechnen
        working-directory: marketdata-pipeline
        env:
          PYTHONPATH: ./src
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          mkdir -p work
          STAMP=$(date +%Y%m%d-%H%M)
          FLAG=""; [ "${IN_FORCE}" = "true" ] && FLAG="--force"
          python src/rotation_kern.py --state-dir state --md "work/KERN-ROTATION-$STAMP.md" $FLAG
          cat work/KERN-ROTATION-*.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketdata-pipeline/state/rotation_kern.json
          git commit -m "state: Kern-Rotation ($(date -u +%Y-%m-%dT%H:%MZ))" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Bericht in den Briefing-Ordner
        working-directory: marketdata-pipeline
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          BRIEFING_FOLDER_ID: 1_oQBr6KH7u6FDCAUIs1liTnEFjn-b_Ht
          PYTHONPATH: ./src
        run: |
          python - <<'PY'
          import os, pathlib
          from drive_writer import build_drive_service, write_markdown_file
          svc = build_drive_service(); folder = os.environ["BRIEFING_FOLDER_ID"]
          for p in sorted(pathlib.Path("work").glob("KERN-ROTATION-*.md")):
              txt = p.read_text(encoding="utf-8")
              if "Signal zum Monatsende" in txt:          # Vorschau-Tage landen nicht im Drive
                  write_markdown_file(svc, folder, p.name, txt)
          PY
