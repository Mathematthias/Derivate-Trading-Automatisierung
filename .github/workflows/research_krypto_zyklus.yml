name: Research Krypto-Zyklus 2026-11-20

# User-Auftrag 2026-11-20: Messung fuer die Thesenkarte Krypto-Zyklustief. Reine Messung, aendert
# keine Regel und keinen State. Nur auf dem Research-Branch.

on:
  push:
    branches: [research/krypto-zyklus-2026-11-20]
    paths:
      - 'marketdata-pipeline/research/krypto_zyklus/*.py'
      - '.github/workflows/research_krypto_zyklus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  messung:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: marketdata-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Messung
        run: |
          python research/krypto_zyklus/krypto_zyklus.py
          cat research/krypto_zyklus/out/ZYKLUS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit Bericht
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketdata-pipeline/research/krypto_zyklus/out/
          git commit -m "research: Krypto-Zyklus Bericht [skip ci]" || exit 0
          git push origin HEAD:research/krypto-zyklus-2026-11-20
