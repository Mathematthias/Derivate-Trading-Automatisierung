name: Marketdata Sync Tier B (Gamechanger-Hunt)

# Sync-Schedule für Tier B (TecDAX/Biotech/NASDAQ-Growth/AI-Quantum):
#   - 1× täglich Mo-Fr 07:30 CET (= 05:30 UTC im Winter, 06:30 UTC im Sommer)
#   - 06:30 UTC ist Sommerzeit-konform (CEST)

on:
  schedule:
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: marketdata-pipeline/marketdata-pipeline
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        working-directory: marketdata-pipeline/marketdata-pipeline
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          STATE_DOC_ID: 17KgjCjFiy15JsSRD8h_EK5lL_PitkOJIC7ou1LYOcks
          BRIEFING_FOLDER_ID: 1jKuyo12c38sg8Ff4ZHFXHqsU_Nl2D4AA
          MODE: tier_b
          CONFIG_DIR: ./config
          PYTHONPATH: ./src
        run: |
          python src/marketdata_sync.py
