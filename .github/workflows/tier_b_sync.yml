name: Marketdata Sync Tier B (Gamechanger-Hunt)

# Trigger-Architektur (seit 2026-04-30):
#   Single Source of Truth ist cron-job.org (externer Cron-Service mit
#   PAT-basiertem workflow_dispatch). GitHub-eigene Schedules wurden wegen
#   Unzuverlässigkeit (verzögertes/ausgelassenes Feuern) deaktiviert.
#
# Tier-B-Slot in cron-job.org (Berlin-Zeit):
#   - Mo-Fr 08:30                                  → Crontab: 30 8 * * 1-5
#
# Da cron-job.org bereits in Berlin-Zeit triggert und nur zur gewünschten
# Zeit feuert, ist das frühere Berlin-Time-Gate obsolet und entfernt. Bei
# Neuinstallation/Migration siehe Memory-Notiz „PAT renewal deadline 2026-07-21".

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: marketdata-pipeline
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        working-directory: marketdata-pipeline
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          # Workspace Shared Drive: Trading-Pipeline (STATE = echtes Google Doc)
          STATE_DOC_ID: 1ssFEij6_1x6tM0lnRzIHzVRMNL6Z69CWYwmdOi-EaLg
          BRIEFING_FOLDER_ID: 1_oQBr6KH7u6FDCAUIs1liTnEFjn-b_Ht
          MODE: tier_b
          CONFIG_DIR: ./config
          PYTHONPATH: ./src
        run: |
          python src/marketdata_sync.py

      - name: Run Adhoc-Catalyst-Scan
        continue-on-error: true
        working-directory: marketdata-pipeline
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          STATE_DOC_ID: 1ssFEij6_1x6tM0lnRzIHzVRMNL6Z69CWYwmdOi-EaLg
          BRIEFING_FOLDER_ID: 1_oQBr6KH7u6FDCAUIs1liTnEFjn-b_Ht
          PYTHONPATH: ./src
        run: |
          python src/adhoc_scanner.py --hours 24
