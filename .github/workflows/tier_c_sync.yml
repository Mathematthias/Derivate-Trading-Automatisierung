name: Marketdata Sync Tier C (US-Universum)

# Trigger-Architektur (seit 2026-04-30):
#   Single Source of Truth ist cron-job.org (externer Cron-Service mit
#   PAT-basiertem workflow_dispatch). GitHub-eigene Schedules wurden wegen
#   Unzuverlässigkeit (verzögertes/ausgelassenes Feuern) deaktiviert.
#   Seit 2026-05-13 zusätzlich Hygiene-Bestätigung: KEIN `on: schedule` —
#   bei öffentlichem Repo zudem unzuverlässig.
#
# Tier C entstand 2026-05-13 als Variante-A-Split: Tier B war mit ~308
# Symbolen zu unrobust, isolierte SSL-Crashes beim Drive-Upload. Aufteilung:
#   - Tier B = EU-Universum (DAX + MDAX + SDAX + EuroStoxx + SMI, ~211)
#   - Tier C = US-Universum (NASDAQ-100, ~96)
# Beide Tiers laufen jetzt mit identischer Architektur, nur unterschiedlichen
# Ticker-YAMLs und Output-Tags ("EU" bzw. "US").
#
# Tier-C-Slots in cron-job.org (Berlin-Zeit) — Empfehlung 2×/Tag:
#   - Mo-Fr 14:30 (vor US-Open 15:30 CEST)  → Crontab: 30 14 * * 1-5
#   - Mo-Fr 21:30 (nach US-Close 22:00 CEST)→ Crontab: 30 21 * * 1-5
#
# PAT-Renewal-Deadline: 2026-07-21 (siehe Memory-Notiz).

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: marketdata-pipeline
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        working-directory: marketdata-pipeline
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          # Workspace Shared Drive: Trading-Pipeline (STATE = echtes Google Doc)
          STATE_DOC_ID: 1ZVmRDY1vQdw_5dv6X7GtqSym5MSnPlvp
          BRIEFING_FOLDER_ID: 1_oQBr6KH7u6FDCAUIs1liTnEFjn-b_Ht
          MODE: tier_c
          CONFIG_DIR: ./config
          PYTHONPATH: ./src
          # Setup-Class-Flags (EMA200-MeanRev + PEAD-Window) auch in Tier C aktiv —
          # ~96 Symbole, Earnings-Pull-Last verkraftbar.
          EARNINGS_PULL: "1"
        run: |
          python src/marketdata_sync.py

      - name: Run Adhoc-Catalyst-Scan
        continue-on-error: true
        working-directory: marketdata-pipeline
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          STATE_DOC_ID: 1ZVmRDY1vQdw_5dv6X7GtqSym5MSnPlvp
          BRIEFING_FOLDER_ID: 1_oQBr6KH7u6FDCAUIs1liTnEFjn-b_Ht
          PYTHONPATH: ./src
        run: |
          python src/adhoc_scanner.py --hours 24
