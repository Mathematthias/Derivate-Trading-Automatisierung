# DIVIDEND-SCAN — Zusatz-Pool und Cluster-Etiketten (seit 2026-10-04)
#
# Der Scan läuft über Tier B (EU) + Tier C (NASDAQ-100) + diesen Pool.
# Dieser Pool ergänzt Werte, die in keinem Tier stehen (US-Hochrendite
# außerhalb des NASDAQ-100, Schifffahrt, UK) und vergibt Cluster-Etiketten,
# damit die Klumpen-Bremse (max_per_cluster) greift.
#
# Einträge mit einem Symbol, das schon in Tier B/C steht, fügen NUR das
# Cluster-Etikett hinzu (kein Doppel-Pull).
#
# Konfidenz wie in den Tier-YAMLs: [H] sicher, [M] beim ersten Lauf prüfen.
# Stand der Auswahl: 2026-10-04, Quelle der Kandidaten: Recherche im Chat
# (24/7 Wall St. 2026-09-18, Yahoo Finance 2026-06-09, biallo.de 2026-04-09).
#
# BEWUSST NICHT AUFGENOMMEN:
#   - US-MLPs (Energy Transfer ET, Enterprise Products EPD, ...): Publicly
#     Traded Partnerships — für Nicht-US-Anleger Quellensteuer bis 37 % auf
#     Ausschüttungen und 10 % auf den Verkaufserlös (Section 1446(f)), dazu
#     K-1-Formulare. Für ein deutsches Depot ungeeignet.
#   - Rüstung (Ethik-Regel 2026-04-15).

