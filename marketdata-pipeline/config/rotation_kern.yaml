# Kern-Rotation (Neuaufstellung A+, User-Entscheid 2026-11-07)
# Signal auf US-ETFs mit langer Historie, Ausfuehrung im UCITS-Pendant.
# Ethik: US-Industrie (XLI) und Deutschland (EWG, Rheinmetall im DAX) raus;
# Japan raus (kein brauchbares SRI-Vehikel); Software (IGV) raus (kein sauberes UCITS-Pendant).
# Backtest 2008-2026 (research/backtest-2026-11-07): Top 4 + Absolutfilter ~13,6 % p. a., MaxDD -25,5 %.

kapital_eur: 8000
top_n: 4
