# Kern-Rotation (Neuaufstellung A+, User-Entscheid 2026-11-07)
# Signal auf US-ETFs mit langer Historie, Ausfuehrung im UCITS-Pendant.
# Ethik: US-Industrie (XLI) und Deutschland (EWG, Rheinmetall im DAX) raus;
# Japan raus (kein brauchbares SRI-Vehikel). Gold raus (User 2026-11-07): Xetra-Gold faellt unter § 23 EStG,
# Gewinne < 1 Jahr zum persoenlichen Satz und nicht mit dem Kapitalertrags-Verlusttopf verrechenbar. Software: kein UCITS-Pendant zu IGV, daher Signal SKYY
# (ISE CTA Cloud Computing) mit dem First-Trust-UCITS als Vehikel (User 2026-11-07: Software soll rein).
# Backtest 2008-2026 (research/backtest-2026-11-07): Top 4 + Absolutfilter ~13,6 % p. a., MaxDD -25,5 %.

