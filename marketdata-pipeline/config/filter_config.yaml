# filter_config.yaml — Setup-Klassifikations-Schwellwerte
# Stand: 2026-04-25, V0.2 (Phase 0 Rebuild — zweistufige Architektur)
#
# Diese Datei definiert die NUMERISCHEN GRENZWERTE der Filter-Engine.
# Änderungen hier brauchen KEINEN Code-Push, nur Repo-Push und nächster
# GitHub-Action-Lauf zieht sie.
#
# === ARCHITEKTUR-WICHTIG ===
# Filter-Engine ist ZWEISTUFIG:
#   Stufe 1: Watchlist-Trigger-Check
#     - Liest STATE-Doc Watchlist mit konkreten Triggern (Trigger A, Trigger B)
#     - Berechnet pro Trigger: ist erfüllt / wie nah / Status
#     - Ausgabe: WATCHLIST-STATUS-Sektion in CANDIDATES.md
#     - Hier gibt es KEINE generische Setup-Erfindung — nur Status-Check
#       gegen DEINE konkreten Trigger-Definitionen
#
#   Stufe 2: Universe-Setup-Suche (für NEUE Kandidaten)
#     - Läuft über Tier-A-Universe minus Watchlist (= ~150 Ticker später)
#     - Wendet die generischen Setup-Filter unten an
#     - Ausgabe: NEW-CANDIDATES-Sektion in CANDIDATES.md
#     - Hier gilt: lieber leer als unsauber. Kein Druck zu Treffern.
#
# Die Schwellwerte unten gelten NUR für Stufe 2.

# ============================================================
# UNIVERSELLE DISQUALIFIER (Stufe 2 — neue Kandidaten)
# ============================================================
universal_disqualifier:
  # Liquidität: minimales 20-Tages-Durchschnittsvolumen × Schlusskurs in EUR
  # Empirie 2026-04-25: 1M EUR ist gute Schwelle
  # SDAX-Werte mit niedrigem Kurs (<5€) kommen bei 1M EUR durch
  # KO-Spreads bei 1M EUR/Tag sind erfahrungsgemäß noch akzeptabel
  min_avg_volume_eur: 1_000_000

  # Earnings-Risk: Tage bis zur nächsten Quartalszahl
  # Trades zu nah an Earnings = unkalkulierbares Gap-Risiko
  earnings_blackout_days: 7

  # 30d-Move-Limit (Lektion 8): Late-Entry-Schutz
  # Long: >+15% in 30 Tagen disqualifiziert für neuen Long-Einstieg
  # Short: <-15% in 30 Tagen disqualifiziert für neuen Short-Einstieg
  thirty_day_move_max_pct: 15.0

  # ATR-Deckel (neu 2026-08-28) — Volatilitaets-Obergrenze fuer NEUE Kandidaten.
  # Gemessen als ATR-14 in Prozent vom Schlusskurs.
  #
  # WARUM UEBERHAUPT: Bei sehr hoher relativer ATR ist der Lektion-4-Stop
  # (1,5 x ATR) so weit, dass die Position winzig wird und die Zone im
  # Tagesrauschen verschwindet. Solche Werte sind nicht "riskant", sie sind
  # mit dieser Methode schlicht nicht sinnvoll handelbar.
  #
  # WARUM 8,0 UND NICHT 5,5: Die 5,5%-Schwelle aus Journal-Note #184
  # (Iron-Coupling) sagt "anders behandeln", nicht "nicht handeln" — sie wird
  # skill-seitig als FLAG im Briefing gefuehrt, nicht hier als Ausschluss.
  # Dieser Deckel greift erst, wo auch eine angepasste Methode nicht mehr traegt.
  # Strenger einstellen: 6.5 waere die konservative Alternative.
  #
  # GILT NUR FUER STUFE 2 (Universe-Scan / neue Kandidaten). Watchlist-Eintraege
  # laufen ueber Stufe 1 und sind NICHT betroffen — eine eigene Setup-
  # Entscheidung wird nicht nachtraeglich von einem Schwellwert kassiert.
  # ATR schwankt: ein Wert faellt automatisch wieder unter den Deckel und ist
  # dann wieder Kandidat. Deshalb Filter statt Universums-Ausschluss.
  max_atr_pct: 8.0

# ============================================================
# LONG-TREND-PULLBACK (höchste Häufigkeit deiner Trades)
# Setup: Aufwärtstrend intakt, Kurs zieht zur EMA20/50, Bounce-Bereich
# ============================================================
long_trend_pullback:
  require_bullish_ema_stack: true   # EMA20 > EMA50 > EMA200 (Daily)
  ema_distance_min_pct: -1.0        # Kurs darf 1% unter EMA20 stehen (Touch)
  ema_distance_max_pct: 2.5         # Kurs darf bis 2.5% über EMA20 stehen
  trigger_ema_priority: ["EMA20", "EMA50"]
  rsi_max: 65                       # nicht überkauft
  min_distance_from_52w_high_pct: 2.0  # Mindestabstand vom 52W-Hoch

# ============================================================
# SHORT-TREND-PULLBACK / Bounce-Test (Spiegel zu Long)
# Setup: Abwärtstrend intakt, Kurs bouncet zur EMA20/50 von unten
# ============================================================
short_trend_pullback:
  require_bearish_ema_stack: true   # EMA20 < EMA50 < EMA200
  ema_distance_min_pct: -2.5        # Kurs darf 2.5% unter EMA20 stehen
  ema_distance_max_pct: 1.0         # Kurs darf 1% über EMA20 stehen (Touch)
  trigger_ema_priority: ["EMA20", "EMA50"]
  rsi_min: 35                        # nicht überverkauft
  min_distance_from_52w_low_pct: 2.0   # Mindestabstand vom 52W-Tief

  # Short-spezifische Disqualifier
  disqualifier_active_buyback: true        # Bei aktivem Buyback NIEMALS shorten
  disqualifier_dividend_within_days: 14    # Vor Ex-Tag großer Div nicht shorten

# ============================================================
# BREAKOUT (Long) / BREAKDOWN (Short)
# Setup: Kurs durchbricht 20d-Hoch (Long) bzw. 20d-Tief (Short) mit Volumen
# ============================================================
breakout_long:
  distance_to_20d_high_pct: 1.0     # innerhalb 1% vom 20d-Hoch
  volume_multiplier_min: 1.5        # heute mindestens 1.5× avg-Volumen
  require_bullish_ema_stack: true
  rsi_max: 70

breakdown_short:
  distance_to_20d_low_pct: 1.0
  volume_multiplier_min: 1.5
  require_bearish_ema_stack: true
  rsi_min: 30

# ============================================================
# REVERSAL (selten, hohe Aufmerksamkeit)
# Long: 52W-Tief + RSI<30, Short: 52W-Hoch + RSI>70 + Distribution
# ============================================================
reversal_long:
  distance_from_52w_low_pct: 5.0    # innerhalb 5% vom 52W-Tief
  rsi_max: 30                        # überverkauft

reversal_short:
  distance_from_52w_high_pct: 5.0   # innerhalb 5% vom 52W-Hoch
  rsi_min: 70                        # überkauft

# ============================================================
# GAMECHANGER (nur für Tier B, Stufe 2 — Catalysts ohne Setup)
# ============================================================
gamechanger:
  pre_market_move_min_pct: 5.0      # Yahoo Pre-Market 15-20 Min delayed
  volume_multiplier_extreme: 5.0     # 5× durchschnittliches Tagesvolumen
  gap_open_min_pct: 3.0
  fresh_52w_extreme_days: 2          # 52W-Extrem innerhalb 2 Tagen

# ============================================================
# WATCHLIST-TRIGGER-PARSING (Stufe 1)
# Hinweise wie der STATE-Watchlist-Parser die Trigger interpretiert
# ============================================================
watchlist_trigger_parsing:
  # Distanz zum Trigger-Korridor in % als Status-Kategorien
  # ROHE %-SCHWELLEN — nur noch Fallback (wenn ATR fehlt oder ATR-Block aus).
  trigger_proximity:
    in_zone:           0.0   # Kurs IN der Trigger-Zone
    very_close:        2.0   # innerhalb 2% vor/nach
    close:             5.0   # innerhalb 5%
    watching:         10.0   # innerhalb 10% — auf Radar
    far:              99.0   # weiter als 10% — passive

  # ATR-NORMALISIERTE SCHWELLEN (2026-07-12) — Vielfache von ATR14-1D.
  # Aktiv wenn enabled=true UND ATR im Snapshot vorhanden. Macht die Buckets
  # vola-adaptiv: 2% sind bei ruhigem Wert (ATR 1%) 2 ATR = weit, bei
  # zappeligem (ATR 6%) 1/3-ATR = quasi in-zone. distance_pct bleibt als
  # Anzeige-% erhalten; klassifiziert wird auf distance_atr.
  trigger_proximity_atr:
    enabled:        true
    in_zone:         0.0    # Kurs IN der Trigger-Zone
    very_close:      0.75   # innerhalb 0,75 ATR
    close:           1.5    # innerhalb 1,5 ATR
    watching:        3.0    # innerhalb 3,0 ATR — auf Radar
    far:            99.0    # weiter — passive

  # Volumen-Validierung wenn Trigger "auf Vol ≥30D-Ø" enthält
  volume_validation:
    require_multiplier: 1.0   # mindestens 30D-Durchschnitts-Volumen heute

  # Hard-Evaluation-Stunde (UTC): Bis zu dieser Stunde ist Vol "pending"
  # (Tagesvolumen kann sich noch füllen), danach "failed".
  # 20 UTC = 21 CEST (Winterzeit) / 22 CEST (Sommerzeit) — nach US-Close.
  hard_evaluation_utc_hour: 20

  # Bounce-Erkennung wenn Trigger "+ Bounce" oder "+ Reversal" enthält
  bounce_detection:
    require_lower_wick_pct: 30   # Daily-Kerze: untere Wick mind. 30% der Range
    require_close_above_open: true   # Close > Open für Bounce-Bestätigung

  # Lifecycle-Status-Filter (welche Stati werden geprüft, welche ignoriert)
  lifecycle_status:
    # Werden geprüft und in WATCHLIST-STATUS-Output aufgenommen:
    active_statuses: ["aktiv", "pending", "paused", "beobachten"]
    # Werden komplett ignoriert (sind in Archiv-Sektion gewandert):
    ignored_statuses: ["gelaufen", "these_geplatzt", "chart_not"]

  # REVIEW-WARNING: Eintrag zu lange im "beobachten"-Status?
  review_warning:
    enabled: true
    days_threshold: 14   # nach 14 Tagen passive → Warning erzeugen
    # Warning erscheint im CANDIDATES-Output unter "REVIEW-EMPFEHLUNGEN"

# ============================================================
# OUTPUT-FORMATIERUNG
# ============================================================
# R:R-Vorfilter fuer Stufe-2-Pullback-Buckets (Paket A, 2026-06-09)
# Proxy: (20d-Extrem - Kurs) / (atr_mult x ATR14). Unter min_rr -> Flag "ENG"
# im Summary (kein Ausschluss). Nur long/short_trend_pullback.
rr_proxy:
  enabled: true
  atr_mult: 1.5
  min_rr: 1.4

  # --- Klassenabhaengige Reward-Definition (Fix 2026-09-09) ------------------
  # Die Pullback-Definition (Reward = Abstand zum 20d-Extrem) war fuer die
  # Ausbruchs-Buckets arithmetisch toedlich: deren Gate verlangt <= 1 % Abstand
  # zum Extrem, der ENG-Test verlangt rr >= min_rr — zusammen ATR <= 0,476 %
  # vom Kurs. Das erfuellten am 2026-09-09 zwei von 102 Universumswerten, keine
  # Einzelaktie. Folge: breakout_long und breakdown_short standen in drei
  # aufeinanderfolgenden Digests bei null Pitches, obwohl Kandidaten erzeugt
  # wurden. Hier greift stattdessen die Measured-Move-Projektion: Ziel =
  # Ausbruchsniveau +/- Hoehe der 20-Tage-Range.
  measured_move_buckets:
    - "breakout_long"
    - "breakdown_short"

  # Fuer ein Reversal ist das 20d-Extrem weder Einstieg noch Ziel, und eine
  # belastbare Zielstrecke ist nicht gemessen. Statt eine Zahl zu erfinden,
  # laeuft die Klasse ohne ENG-Vorfilter. Sie kam als einzige der vier
  # Nicht-Pullback-Klassen ohnehin durch (digest 07.-09.09.: reversal_long 1-3,
  # reversal_short 1-3 Pitches je Lauf).
  exempt_buckets:
    - "reversal_long"
    - "reversal_short"

# Bucket-4-Pitches im BRIEFING-DIGEST (2026-07-12). Tier B/C schreiben je ein
# PITCHES-{EU,US}.json (gerankte Stufe-2-Kandidaten), Tier A faltet die Top-N
# in den Digest → Morning-Check deckt alle 6 Buckets in einem Fetch ab. Nur
# Trend-Pullbacks mit R:R-Proxy; ⚠️ENG und trendlose raus; Ethik gefiltert.
# --- GRINDER-BLOCK (Bucket 4, erster Block) ---------------------------------
# FEHLTE bis 2026-09-07 komplett in dieser Datei: build_grinders_payload lief
# seit dem 2026-09-04 ausschliesslich auf seinen Hardcode-Defaults, und die
# beiden Tests in tests/test_grinders.py, die die Sektion lesen, waren rot.
# Werte hier = die Defaults aus dem Code, damit sich das Verhalten NICHT aendert.
grinders:
  enabled: true
  top_n: 5            # 3 -> 5 (User-Wunsch 2026-09-07)
  max_atr_pct: 2.5        # der Stop muss billig sein
  max_dist_atr: 0.5       # Kurs klebt an der EMA20
  min_move_atr: 1.0       # Trendstaerke in ATR-Einheiten, NICHT in Prozent
  # 🆕 GRINDER-CONTINUATION v0.1 (User-Entscheid 2026-09-08): Tempo ist ab jetzt
  # GATE, nicht nur Rangfolge. Begruendung: tempo = |30d-Move| / ziel_pct sagt,
  # wie oft der Trend in 30 Tagen die fuer R:R 2,0 noetige Strecke geliefert hat.
  # Die Klasse verspricht "R:R >= 2 in rund 30 HT" — dann muss genau diese Groesse
  # ueber der Schwelle liegen. min_move_atr allein laesst Tempo 0,54 durch (JNJ,
  # Lauf 2026-09-08 18:05), was einem Horizont von rund 55 HT entspraeche.
  # 0,9 statt 1,0, weil der Wert tagesweise schwankt: KNIN.SW stand am 2026-09-08
  # um 09:33 bei 1,15, um 14:33 bei 1,05 und um 18:05 bei 0,94 — eine harte
  # 1,0-Kante wuerde denselben Wert dreimal am Tag rein- und rauswerfen.
  min_tempo: 0.9
  require_weekly_hhll: true
  rr_ziel: 2.0            # Zielweite = rr_ziel * 1,5 * ATR%

# === 4h-LAYER (v0.1, 2026-09-08) =============================================
# Schliesst die Luecke, aus der der Verdeckt-BEREIT-Mechanismus entstanden ist:
# Die Trigger verlangen "4h-Bullish-Reverse-Close" und "RSI-4h Cross", das
# Universum fuehrte aber nur 1D. Zusaetzlich braucht Grinder-Continuation eine
# 4h-Warnstufe (§ SKILL.md).
#
# ⚠️ evaluate_reverse SCHALTET DAS BUCKET-VERHALTEN UM. Steht es auf true,
# wird ein 4h-Reverse maschinell entschieden statt als Handcheck gemeldet —
# aus BEREIT* wird BEREIT oder NAHE. Erst nach einem verifizierten Live-Lauf
# einschalten: scripts/verify_4h_coverage.py. Der Layer wurde am 2026-09-08
# gegen synthetische Daten getestet, NICHT gegen echte Yahoo-Intradaydaten.
intraday_4h:
  enabled: true             # Indikatoren ziehen und im Digest ausweisen
  evaluate_reverse: false   # 🔴 Bucket-Verhalten: bis zur Live-Verifikation AUS
  # 🆕 Zweiter, UNABHAENGIGER Schalter (2026-09-08): der RSI-Cross ueber die
  # Signallinie. Bis dahin hat der Parser diese Bedingung gar nicht gesehen —
  # sie stand in 21 von 38 aktiven Triggern und existierte fuer die Pipeline
  # nicht. Seit 2026-09-08 wird sie mindestens als Handcheck gemeldet; auf true
  # entscheidet sie mit. Getrennt vom Reverse-Schalter, weil es zwei
  # unabhaengige Entscheidungen mit verschiedenem Risiko sind.
  evaluate_rsi_cross: false
  period: "60d"             # 1h-Historie; 60d = ~120 4h-Balken bei XETRA
  rsi_signal_len: 14        # SMA auf dem RSI, wie im TradingView-Setup
  bars_per_block: 4         # 1h -> 4h, session-verankert

pitches:
  # Bucket-4-Quote (User-Entscheid 2026-09-07): 6 trendkonforme + 4 Counter-Trend.
  # Die Reihenfolge im Briefing IST die Suchbudget-Zuteilung, deshalb getrennte
  # Toepfe statt eines gemeinsamen Top-N — sonst belegen Counter-Trend-Setups die
  # vorderen Plaetze (RRprox misst Fallhoehe, und Fallhoehe entsteht durch
  # Extension) und verbrauchen das Budget der trendkonformen.
  quota:
    trend: 6
    counter: 4
  top_n: 10          # historischer Gesamtdeckel, = trend + counter
  # GILT NUR FUER DIE COUNTER-TREND-LANE. Fuer ein Reversal ist die Bewegung die
  # These; fuer einen Trend-Pullback ist sie ein Ausschlusskriterium ohne Bezug
  # zum Setup (Befund 2026-09-07: 4 von 10 trendkonformen Kandidaten fielen hier
  # heraus, darunter ENI.MI mit +0,2 %).
  min_abs_move30d: 1.0          # Trend-Gate: |30d-Move| muss >= 1% sein
  ethics_exclude:               # Angriffswaffen-Kerngeschaeft, nie als Pitch
    - RHM.DE                     # Rheinmetall
    - BA.L                       # BAE Systems
  ethics_grenzfall:             # bleiben drin, im Chat bewerten
    - HAG.DE                     # Hensoldt (Defense-lastig, Sensorik)

output:
  # Stufe 1: Watchlist-Status — IMMER im Output, sortiert nach Trigger-Nähe
  watchlist_status_always_visible: true

  # Paket B (2026-06-09): Stufe-1-Block in GAMECHANGER-HUNT-Files (Tier B/C)
  # unterdruecken — redundant zu CANDIDATES. true = altes Verhalten.
  gamechanger_include_watchlist: false

  # Stufe 2: Maximale neue Kandidaten pro Setup-Bucket
  max_new_candidates_per_bucket: 5

  # Reihenfolge der Setup-Buckets im Output (Stufe 2)
  bucket_order:
    - "long_trend_pullback"
    - "breakout_long"
    - "reversal_long"
    - "short_trend_pullback"
    - "breakdown_short"
    - "reversal_short"

  # Liquiditäts-Filter weicher anwenden bei diesen Kategorien?
  # Indizes/Rohstoffe/Krypto: niemals Liquiditätsfilter (kein Sinn)
  # positionen: offene Positionen IMMER tracken, egal wie illiquide
  # watchlist_state: alle Werte aus STATE-Watchlist (auch wenn illiquide)
  bypass_liquidity_for_categories:
    - "indizes"
    - "rohstoffe_forex"
    - "krypto"
    - "positionen"
    - "watchlist_state"
