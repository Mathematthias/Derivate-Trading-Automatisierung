- id: Z76
  date: '2026-09-27'
  kat: 1
  ereignis: 'Richtlinie (EU) 2024/825 ueber die Staerkung der Verbraucher fuer den gruenen Wandel (EmpCo) wird in der gesamten EU anwendbar. Drei neue Verbotstatbestaende in Anhang I der Richtlinie ueber unlautere Geschaeftspraktiken: Nachhaltigkeitssiegel ohne anerkanntes Zertifizierungssystem; produkt- oder unternehmensbezogene Umweltaussagen, die tatsaechlich nur einen Teilaspekt betreffen; generische Umweltaussagen ("gruen", "umweltfreundlich") ohne nachgewiesene anerkannt hervorragende Umweltleistung. Gilt ausdruecklich auch fuer Ware, die vor dem Stichtag ausgeliefert wurde und im Regal steht.'
  werte: OR.PA, BEI.DE, HEN3.DE, AD.AS, HFG.DE, NESN.SW, ULVR.L, BN.PA, ZAL.DE, ADS.DE
  wirkung: 'Kostenbasis und Marktzugang auf der Anbieterseite, breit und je Emittent klein. Verpackungen, Etiketten und Werbemittel mit generischen Umweltaussagen muessen ersetzt oder belegt werden; der Aufwand faellt einmalig beim Umstellen und danach laufend in der Claim-Pruefung an. Keine Mengen- oder Preiswirkung auf das Produkt selbst. Die Gegenrichtung ist klein und real: Anbieter mit zertifizierten Siegeln verlieren den Wettbewerb gegen unbelegte Claims. SEKTOR-DATUM, KEIN EINZELWERT-TERMIN — dieselbe Klasse wie Z62 (CRA), die keine messbare Einzelwertreaktion hatte. KEIN Fall fuer die 5-Handelstage-Sperrfrist.'
  status: erledigt
  quelle: 'Richtlinie (EU) 2024/825, Anwendungsdatum Art. 4; bestaetigt bei coslaw.eu ("Generic environmental claims and practices banned in the EU from 27 September 2026") und im Q&A der Kommission zur EmpCo-Richtlinie (transition-pathways.europa.eu). Abruf 2026-09-14. confidence HOCH — Anwendungsdatum und Verbotstatbestaende belegt; die nationalen Umsetzungsgesetze und ihre Sanktionshoehen NICHT je Mitgliedstaat gegengelesen. ⚠️ Getrackt: OR.PA ist offene Position #87; BEI.DE Z78, AD.AS Z73 und HFG.DE Z79 sind aktive Short-Zeilen. (INBOX 2026-09-14, eingetragen 2026-09-15) | ERLEDIGT 2026-09-28: seit 27.09. EU-weit anwendbar, keine Verschiebung; Stichtag Sonntag, Kursreaktion nicht messbar.'
- id: Z77
  date: '2027-01-01'
  kat: 1
  ereignis: 'FRTB: Die Eigenmittelanforderungen fuer das Marktrisiko nach dem EU-Bankenpaket (CRR3) werden zum 01.01.2027 anwendbar. Die Kommission hat am 2026-06-04 einen delegierten Rechtsakt mit befristeten Anpassungen angenommen — ein Multiplikator daempft die Kapitalwirkung fuer EU-Banken, und zwar drei Jahre lang ab demselben Stichtag. Der Rechtsakt lief zum Zeitpunkt der Veroeffentlichung noch in der dreimonatigen Einspruchsfrist von Parlament und Rat (verlaengerbar um weitere drei Monate).'
  werte: INGA.AS, DBK.DE, CBK.DE, BNP.PA, ACA.PA, GLE.PA, ISP.MI, UCG.MI, SAN.MC, UBSG.SW, BARC.L, HSBA.L
  wirkung: 'Kostenbasis des Handelsbuchs. Hoehere Eigenmittelunterlegung je Einheit Marktrisiko verteuert Market-Making und Eigenhandel und wirkt damit auf die Kapitalallokation der Handelssparten — am staerksten bei Haeusern mit grossem Handelsbuch, am schwaechsten bei Retail- und Kommerzbanken. Der Multiplikator ist die Gegenrichtung: er ist ausdruecklich als Schutz der Wettbewerbsfaehigkeit gegenueber Nicht-EU-Haeusern gedacht und nimmt dem Stichtag einen Teil seiner Wirkung. ACHTUNG ZWEISEITIG: die Einspruchsfrist kann den Rechtsakt noch kippen — dann traete der ungedaempfte Standard in Kraft, was die Wirkung VERSTAERKT statt sie aufzuheben.'
  status: offen
  quelle: Europaeische Kommission, "Commission adopts temporary adjustments to Basel III Market Risk Rules to safeguard EU banks' competitiveness", 2026-06-04, woertlich "apply for three years from 1 January 2027"; EBA-Papier "EBA consideration on the application of the FRTB from 1 January 2027" (08/2026). Abruf 2026-09-14. confidence HOCH — Datum und Befristung woertlich belegt; Ausgang der Einspruchsfrist offen, Tickerliste illustrativ und nicht auf Handelsbuch-Anteil je Emittent geprueft. ⚠️ INGA.AS Z56 wurde am 2026-09-15 archiviert; der FRTB-Termin liegt ohnehin gut drei Monate hinter jedem laufenden Setup-Fenster. (INBOX 2026-09-14, eingetragen 2026-09-15)
