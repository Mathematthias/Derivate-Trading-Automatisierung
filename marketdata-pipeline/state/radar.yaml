  ereignis: 'SpaceX-Lockup-Freigaben — SYSTEMATIK 2026-09-02 KORRIGIERT: keine Tageszaehlung ab Prospekt, sondern quartalsbericht- und kursbedingungsgebunden. Erste Freigabe 2026-08-06 (zwei HT nach dem ersten Quartalsbericht) mit 911,5 Mio Aktien = 20%, NICHT 7% am 20./21.08. Bedingte Zusatztranche 455,8 Mio nur bei Kurs >=175,50 USD an 5 von 10 HT — NICHT ausgeloest. Zweite Freigabe 2026-08-20 mit 319 Mio (~7%). Naechste Stufe 2026-09-09 mit 319 Mio (~7%). KORRIGIERT 2026-09-15: der Satz "KEIN Septembertermin danach" ist WIDERLEGT — derselbe Trackertyp fuehrt fuer 2026-09-24 eine Stufe ueber 328,4 Mio Aktien (~7%), dazu am 2026-09-10 eine vorgezogene Freigabe von 59,1 Mio fuer Rule-144-Affiliates. Trackerquelle gegen Trackerquelle, confidence bleibt niedrig.'
  werte: SPCX
  wirkung: '- laufender Angebotsdruck bei ~5% Streubesitz'
  status: erledigt
  quelle: 'confidence NIEDRIG — Presse- und Trackerquellen (MarketScreener, Darrow Wealth); die Prospektpassage "Shares Eligible for Future Sale" ist in drei Laeufen nicht direkt lesbar gewesen. Kursreaktion auf die 20%-Freigabe am 06.08. war +6% — der unterstellte Angebotsdruck ist NICHT eingetreten. KATEGORIE-LEHRE (Kat 3): ein Lockup ist ein Vertrag, kein Kalender. (Pflegelaeufe 27./31.08., eingepflegt 2026-09-02) || ERLEDIGT 2026-09-15 (INBOX 14.09.): Stufe 2026-09-09 (319 Mio Aktien, ~7%) eingetreten. Zeile wird NICHT ersatzlos geschlossen — Nachfolgestufe 2026-09-24 neu angelegt.'
