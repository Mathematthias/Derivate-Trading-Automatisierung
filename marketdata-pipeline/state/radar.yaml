  status: erledigt
  quelle: bundesnetzagentur.de, 2026-08-04 | bundesnetzagentur.de, Abruf 2026-09-28 (Kuerzung verstaerkt Lesart schwaches Signal)
  note: '2026-10-05: Gebotstermin 01.10.2026 eingetreten. Volumen 296.269 kW und Hoechstwert 10,00 ct/kWh wie publiziert (keine Anhebung durch EU-Beihilfefreigabe bis 30.09.). Zuschlaege am Stichtag nicht veroeffentlicht; BNetzA-Seite Stand 26.08.2026, Abruf 2026-10-05. Lernschleife Kat 2: Ein Gebotstermin ist kein Bekanntgabetermin — am Termin selbst gibt es nichts zu messen, die Information entsteht erst mit der Zuschlagsliste (historisch 6-10 Wochen spaeter). Kein Folgetermin eingetragen, weil die BNetzA kein Datum fuer die Bekanntgabe nennt.'
- id: Z17
  date: '2026-10-10'
  kat: 5
  ereignis: FDA-PDUFA Ifinatamab Deruxtecan (I-DXd) bei vorbehandeltem ES-SCLC, Priority Review
  werte: 'MRK [= Merck & Co., US — NICHT MRK.DE/Merck KGaA], 4568.T ⚠️ TICKER-KOLLISION (Pflegelauf 07.09., nachgetragen 10.09.): MRK = Merck & Co. (US). NICHT MRK.DE (Merck KGaA).'
  wirkung: + bei Zulassung; fuer MRK klein, fuer Daiichi material
  status: verworfen
  quelle: merck.com, 2026-08-04
  note: '2026-10-12 Pflegelauf: Termin entfallen. Merck & Co. und Daiichi Sankyo haben die BLA fuer Ifinatamab Deruxtecan am 2026-09-25 freiwillig zurueckgezogen — nach FDA-Gespraech erfuellen die Phase-2-Daten (IDeate-Lung01) die Anforderungen fuer Accelerated Approval in der beantragten Indikation nicht. Damit KEINE FDA-Entscheidung am 2026-10-10 und kein neues Datum; Phase-3 IDeate-Lung02 (NCT06203210) nahe Vollrekrutierung, primaere Fertigstellung laut Registereintrag 2028-01 — eine Neueinreichung ist angekuendigt, aber undatiert. Der Pflege-Check vom 2026-10-05 hatte nur das Datum geprueft (Zieldatum unveraendert) und den Rueckzug uebersehen: PDUFA-Zeilen brauchen die Frage ''Antrag noch anhaengig?'', nicht nur ''Datum unveraendert?''. Quelle onclive.com ''Ifinatamab Deruxtecan BLA Voluntarily Withdrawn in Previously Treated Extensive-Stage SCLC'' und biopharmadive.com 2026-09-28, Abruf 2026-10-12.'
- id: Z18
  date: '2026-11-01'
  kat: 2
  ereignis: 'BNetzA Wind an Land: Gebotstermin (Basis 2.500 MW, Hoechstwert 7,25 ct/kWh). Mai-Runde war deutlich ueberzeichnet (6.409 MW Gebote auf 2.495 MW)'
  werte: NDX1.DE, VWS, PNE3.DE, EKT.DE, AB9.DE
  wirkung: + Projektierer bei Ueberzeichnung
  status: offen
  quelle: 'bundesnetzagentur.de, Fachthemen > Ausschreibungen > Wind_Onshore > ''Gebotstermin 1. November 2026'' (Primaerquelle: Volumen 2.495,009 MW und Hoechstwert 7,25 ct/kWh woertlich, Fristverschiebung auf Montag 02.11.2026 24:00 woertlich), Abruf 2026-10-19; Ergebnis der Vorrunde aus Pressemitteilung bundesnetzagentur.de 2026-09-17. confidence hoch'
  note: '2026-10-19 Pflegelauf: Ausschreibungsvolumen jetzt primaer belegt - 2.495,009 MW (die bisherige Angabe ''Basis 2.500 MW'' war aus Par. 28a EEG abgeleitet). Der 01.11.2026 ist ein Sonntag; die BNetzA-Seite nennt die Abgabefrist woertlich Montag, 02.11.2026 24:00 (Gebote an der Pforte Bonn). Datum der Zeile bleibt der kalenderfeste Gebotstermin 2026-11-01, operativ endet die Frist einen Tag spaeter. Der im Feld ereignis zitierte Mai-Rundenstand (6.409 MW auf 2.495 MW) ist ueberholt: die Runde zum 01.08.2026 brachte 5.250 MW Gebote (461 Gebote) auf 2.520 MW Volumen, 237 Zuschlaege ueber 2.523 MW, mengengewichteter Durchschnitt 4,79 ct/kWh (Vorrunde 5,06), Spanne 4,49-4,98 - Ueberzeichnung Faktor rund 2,1 und fallende Zuschlagspreise. ZWEI-TERMIN-PROBLEM wie bei Z14/Z66: der Gebotstermin bewegt nichts, erst die Ergebnisbekanntgabe tut es, und die ist auf der BNetzA-Seite NICHT datiert (Hinweis dort: Freigabe der Sicherheiten bis zu sechs Wochen nach Veroeffentlichung). Keine Teil-2-Zeile
    angelegt, weil kein Datum belegt ist. Keine aktive Watchlist-Zeile auf NDX1.DE, VWS, PNE3.DE, EKT.DE, AB9.DE.'
- id: Z19
  date: '2027-01-10'
  kat: 1
  ereignis: 'ANKER-TERMIN: Chinas 12-monatige Aussetzung der erweiterten SE-Exportkontrollen laeuft aus (Notice 61 inkl. extraterritorialer 0,1%-Regel)'
  werte: MP, LYC.AX, ILU.AX / Abnehmer IFX.DE, CON.DE, VOW3.DE
  wirkung: + Nicht-China-Foerderer bei Nichtverlaengerung / - europaeische Magnet-Abnehmer
  status: offen
  quelle: 'mining-technology.com, 2026-08-04 (Notice 61 und 0,1-%-Regel); Datumsgrundlage jetzt zusaetzlich: Blank Rome LLP, ''The BR International Trade Report: October 2026'' (blankrome.com), woertlich ''two-month extension of the Busan Agreement trade truce'' von 2026-11-10 auf 2027-01-10, angekuendigt von Finanzminister Bessent waehrend des Staatsbesuchs 23.-25.09.2026; techtimes.com 2026-09-29 nennt dieselbe Verlaengerung. Abruf 2026-10-19.'
  note: 'KORR 2026-09-28: Datum 2026-11-10 -> 2027-01-10 (Busan-Truce am 24.09. um zwei Monate verlaengert). 2026-10-19 Pflegelauf: Die Verlaengerung ist jetzt von einer Kanzleiquelle bestaetigt (Blank Rome, Oktober-Trade-Report) - die US-Zollerleichterung wurde im Gegenzug fuer eine Lockerung der chinesischen Seltenerd-Exportkontrollen verlaengert, ''among other terms''. Die itemisierte Bestaetigung, dass Notice 61 samt 0,1-%-Regel mitverlaengert wurde, fehlt weiterhin -> confidence MITTEL bleibt. ZWEITES INSTRUMENT AM SELBEN DATUM: Am 2027-01-10 laeuft auch der Waffenstillstand selbst aus (ausgesetzte Erhoehung des reziproken US-Zollsatzes). Bewusst KEINE eigene Zeile angelegt, um keine Dublette auf dasselbe Datum zu erzeugen; wer Z19 liest, muss wissen, dass zwei Instrumente am selben Tag fallen. Blank Rome nennt zusaetzlich, dass die ausgesetzte Affiliates Rule (EAR) ''widely understood (though not yet formally announced)'' dieselbe Zwei-Monats-Verlaengerung bekommt - unbestaetigt.'
