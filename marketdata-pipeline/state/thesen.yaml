- id: N5
  titel: SpaceX-Lockup-Vollablauf 2026-12-09
  verdikt: beobachten
  re_check: '2026-11-28'
  crowdedness_pp: null
  korb_budget_pct: 0
  falsifikat: Lockup wird verlaengert oder per Waiver aufgehoben, ODER der Kurs schliesst in den fuenf Handelstagen nach 2026-12-09 hoeher als am 2026-12-08 (Angebot absorbiert) -> verworfen
  note: 'Kandidat aus Gruppe 2 (Lockup-/Kapitalmassnahmen-Kalender, Radar Z26). Am 2026-12-09 fallen alle Restbeschraenkungen des 180-Tage-Lockups ausser der 366-Tage-Gruppe um Musk (2027-06-13); Streubesitz waechst von rund 5 % Richtung Mehrheit. Kausalkette: datierter Angebotsschock im Papier selbst, unabhaengig vom Geschaeft. Gegenargument im eigenen Haus: der Spektrumskauf von Grain Management (800-MHz-Low-Band, bis 14 MHz paired, angekuendigt 2026-10-08) hat am 2026-10-09 den Telekomsektor umgepreist und waere eine Story gegen den Angebotsdruck. SPCX nicht im Universum, kein KO-Vehikel bekannt - nach Reform 2026-08-04 eine Vehikelfrage, kein Ausschlussgrund (Kriterium 4 ist kein Gate mehr).'
  historie:
