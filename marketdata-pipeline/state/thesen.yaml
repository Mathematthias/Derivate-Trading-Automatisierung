  note: 'SONDERAUFTRAG S3 (Weg B, Hochstufung geprueft): KEINE Hochstufung auf spielen, Verdikt beobachten und Budget 0 bleiben, Re-Check 2026-11-06 unveraendert. Angelegter Masstab war ausschliesslich Schritt 4b/4c plus Falsifikat - NICHT, dass gerade wenig handelbar ist. 4b: gerichtet (long Gasturbinen-/Kraftwerksbau) erfuellt, Kausalkette Zuschlagsmenge je Technologie -> gesicherter Auftragsbestand erfuellt, Falsifikat beobachtbar erfuellt. Inhaltlich STUETZEND: die BNetzA nennt die erste Auktion (Gebotsschluss 2026-09-08) ''deutlich ueberzeichnet'', quantitative Angaben fehlen; Zuschlagsbekanntgabe bis spaetestens 2026-11-03 (techzeitgeist.de 2026-09-12 unter Berufung auf bundesnetzagentur.de, Abruf 2026-10-24; Sekundaerquelle). Crowdedness 30d: ENR.DE -16,48 / SIE.DE -6,55 vs ^GDAXI -0,34, GEV -14,66 vs ^GSPC -1,04, Mittel -11,99 PP - Unterperformance, Zonenregel ohne Deckel; RWE.DE, UN01.DE und VOW3.DE sind nicht im Digest-Universum. WORAN DIE HOCHSTUFUNG SCHEITERT: die Klasse Thesen-Korb
    verlangt 3-4 Ausdruecke mit je Score >= 5,0, und keiner der drei ist heute ausdrueckbar - ENR.DE 118,68 unter allen vier EMAs (EMA20 135,79 / EMA200 143,62), Stack bearish, RSI 28,8, ATR 4,97 %, Earnings 2026-11-11; SIE.DE 256,80 unter allen vier EMAs (268,12 / 260,76), Stack neutral, RSI 38,6, ATR 2,70 %, Earnings 2026-11-12; GEV 815,00 unter allen vier EMAs (927,48 / 907,58), Stack neutral, RSI 29,9, ATR 5,67 % (ueber der 5-%-Stufe), Earnings 2026-10-28 = 4 HT (Earnings-Sperre). Ein Long in diese drei ist Long gegen aktiven Daily-Abwaertstrend = hartes Veto #1; eine ruhende Limit-Order der Korb-Klasse waere genau das, was Veto #1 verbietet. Der richtige Traeger ist die bestehende ENR.DE-Zeile der Klasse event_watch (Verfall 2026-11-03), nicht ein Korb-Budget. Alle Werte Digest 2026-10-23 22:33.'
