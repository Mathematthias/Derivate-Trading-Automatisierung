  korb_budget_pct: 0
  falsifikat: China verlaengert die Aussetzung von Announcement 61 vor dem 2026-11-10, ODER MOFCOM bestaetigt itemisiert, dass die SE-Exportkontrollen in der Waffenstillstands-Verlaengerung vom 2026-09-28 bis 2027-01-10 enthalten sind -> verworfen
  note: 'NEU, Thesen-Lauf 2026-10-17, Kandidat aus Gruppe 2 (Regulierungs-/Fristenkalender; CATALYST-CALENDAR 2026-10-17, Radar Z19). Chinas 12-monatige Aussetzung der erweiterten SE-Exportkontrollen (Announcement 61 vom 2025-10-09 inkl. extraterritorialer 0,1-%-Regel) laeuft am 2026-11-10 aus; bei Nichtverlaengerung greifen wieder Lizenzpflichten fuer Erbium, Holmium, Europium sowie Verarbeitungsanlagen und -technologie - keine Blockade, eine Genehmigungshuerde. Kausalkette: Lizenzpflicht -> Verfuegbarkeitsrisiko ausserhalb Chinas -> Preisvorteil Nicht-China-Foerderer, Kostendruck europaeische Magnet-Abnehmer. Von MP, LYC.AX, ILU.AX, IFX.DE, CON.DE, VOW3.DE ist nur MP im Universum, Crowdedness daher n=1: MP 30d -18,65 % gegen ^GSPC +0,28 % = -18,93 PP - die Stichprobe traegt die Zahl nicht. MP 40,17 USD, -56,3 % unter 52W-Hoch, Stack bearish, EMA20 45,55, EMA200 53,39, RSI 32,2 und zugleich Breakdown-Retest-Short in derselben Pipeline: Long gegen aktiven Daily-Abwaertstrend = hartes Veto
    #1, deshalb beobachten und Budget 0. Re-Check 2026-11-06 nach MP-Q3 (2026-11-05) und vier Tage vor dem Ereignis. RADAR-KONFLIKT: Z19 datiert dasselbe Ereignis auf 2027-01-10 (Korrektur 2026-09-28, confidence MITTEL, itemisierte Bestaetigung fehlte schon damals); Oktober-Berichterstattung (FXStreet 2026-10-14 u. a., Abruf 2026-10-17) nennt geschlossen 2026-11-10 und trennt die Handelswaffenstillstands-Verlaengerung bis 2027-01-10 von den SE-Kontrollen. Datum in diesem Lauf NICHT geaendert - Pruefung gegen MOFCOM-Primaerquelle gehoert in die Termin-Radar-Pflege am Montag.'
