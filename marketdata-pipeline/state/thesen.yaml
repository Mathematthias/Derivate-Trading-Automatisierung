    ist Beschaffung, keine Kuerzung. NVDA guidete am 2026-11-17 Q4 mit 130,0 Mrd. USD +/- 3 % ueber Konsens, die Haelfte ist erledigt. WAS STATTDESSEN PASSIERTE: 2026-11-20 Nasdaq Composite -5,28 % auf 22.617,73, Nasdaq 100 -5,61 % auf 25.028,98, S&P 500 -3,70 % auf 6.910,39, Dow -1,93 % auf 48.147,33; S&P 500 jetzt -10,7 % unter dem Schlusshoch 7.818,93 vom 2026-10-06 und damit in der Korrektur, Nasdaq 100 rund -19,8 %; 71 von 101 Nasdaq-100-Werten im Baerenmarkt-Gebiet, alle 20 Halbleiter- und Speicherwerte darunter; Philadelphia-Halbleiterindex -10,73 % an einem Tag, alle 30 Werte im Minus; VIX 38,40 (+34,94 %), zeitweise 40, Jahreshoechststand. NVDA schloss 125,53 USD, -14,01 %, rund -16 % auf Wochensicht. Ausloeser laut Quellen: Zweifel an der AI-Finanzierung, Anthropic-Boersengang beruhigte nicht (ANT -8,5 % auf 88,91 USD, knapp ueber IPO-Preis 83), eine zu 91,8 bis 97,5 % eingepreiste Fed-Erhoehung im Dezember (CME), Fed-Governor Cook am 2026-11-20 ''Waiting longer to implement rate
    increases risks getting behind the curve'', Schuldenanzeichen bei CoreWeave, Hunterbrook-Shortbericht zu AMD (AMD -13,26 %). NEU UND NICHT IM FALSIFIKAT ABGEBILDET: Reuters meldete am 2026-11-20, Mitarbeiter der SEC-Enforcement-Abteilung pruefen Bilanzierungsfragen bei Nvidia (zwei nicht benannte Personen, SEC ohne Kommentar, WSJ hatte am 2026-11-17 erstmals berichtet); dazu der Ruecktritt von Jensen Huang um den 2026-11-12. Beides trifft den Anker der Capex-Story, loest aber das Falsifikat wie geschrieben nicht aus. VORSCHLAG AN DEN USER, NICHT EIGENMAECHTIG UMGESETZT: das Thesen-Falsifikat um eine dritte Haelfte ergaenzen, etwa ''NVDA bestaetigt eine SEC-Untersuchung mit Restatement-Bezug oder korrigiert veroeffentlichte Umsaetze''. Das waere eine Verschaerfung, keine Lockerung; das Preis-Falsifikat 131,30 bleibt unverhandelbar. POSITION: 9 Stueck SPDR Technology UCITS ETF, Einsatz 3 x 158,90 + 6 x 153,00 = 1.394,70 EUR, Mischkurs auf XLK-Basis 163,64. Schaetzung des Buchstands mit
