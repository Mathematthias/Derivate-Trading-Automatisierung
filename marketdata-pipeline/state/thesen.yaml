  titel: Deutscher Kapazitaetsmarkt - Zuschlag 2026-11-03
  verdikt: beobachten
  re_check: '2026-11-12'
  crowdedness_pp: -14.36
  korb_budget_pct: 0
  falsifikat: (a) BNetzA gibt am 2026-11-10 keinen Gebotstermin fuer die zweite Langzeitkapazitaets-Runde bekannt, der Termin bleibt also unbestimmt, ODER (b) ENR.DE meldet am 2026-11-11 im Q4-FY2026-Call fuer Gas Services einen Auftragseingang unter dem Umsatz (book-to-bill < 1) -> verworfen.
  note: 'RE-CHECK 2026-11-06 war ueberfaellig, hier erledigt. Das ALTE Falsifikat ist an BEIDEN Haelften WIDERLEGT, nicht eingetreten: (1) Zuschlagsvolumen 5.160 rMW auf 11 Zuschlaege gegen ausgeschriebene 4.500 rMW, 41 Gebote ueber rund 11.958 rMW (BNetzA PM 2026-11-03) - also ueber, nicht deutlich unter dem Volumen; (2) Gasturbinenanteil nicht marginal, sondern vollstaendig: alle 11 Zuschlaege gingen an Gaskraftwerke, kein einziger Stromspeicher (energiezukunft 2026-11-05, cleanthinking 2026-11-03, photon 2026-11-04); Technologieaufteilung laut BMWi rund 2 GW GuD und rund 3 GW Gasturbinen und Gasmotoren. Durchschnittswert 155.296 EUR je rMW und Jahr gegen Hoechstpreis 244.000 EUR, Laufzeit 15 Jahre ab 2031, Zuschlaege gelten ab 2026-11-10. KEINE Hochstufung auf spielen, gemessen allein an 4b/4c und am Falsifikat: (i) die Verguetung beginnt erst 2031 und keine Quelle nennt eine Inbetriebnahmefrist, der Zeitpunkt der Turbinenbestellungen ist also unbestimmt; (ii) der einzige EU-Ausdruck
    ENR.DE ist derselbe Name und nach L7 derselbe Risikoblock wie die am 2026-11-05 verworfene These A, deren Preis-Falsifikat inzwischen um 11,0 % gebrochen ist (PWR 540,90 gegen 607,73); (iii) ein Preis-Falsifikat waere nicht konstruierbar - ENR.DE 118,10 sitzt auf der Unterkante seiner letzten starken Zone 115,00-118,15 (Abstand -0,01 ATR), das Kill-Switch laege also bei null Abstand, derselbe Defekt, der das spielen von TECH wertlos gemacht hat. CROWDEDNESS: -14,36 PP (Vorwoche -10,76; ENR.DE -21,21 / SIE.DE -4,32 gegen ^GDAXI +4,09, GEV -17,54 gegen ^GSPC -5,00).'
