  titel: Lockup-Absorption - Kauf nach dem Ablauftag statt Short auf das Datum
  verdikt: beobachten
  re_check: '2026-12-07'
  falsifikat: Der Backtest ueber mindestens 15 US-Lockup-Ablaeufe ab 2024 zeigt KEINEN positiven Medianertrag in den 20 Handelstagen nach dem Ablauftag gegenueber dem Vortagesschluss, ODER die beiden Ausdruecke schliessen in den fuenf Handelstagen nach dem 2026-11-30 tiefer als am 2026-11-27 (dann wirkt der Ueberhang doch nach dem Datum) -> verworfen.
  ausdruecke:
  - QNT
  - INIO
  note: 'Kandidat aus Abschnitt C des Thesen-Laufs 2026-11-21, direkt aus der heute gemessenen Falsifikation von N12 entstanden. Quellengruppe: Lockup-Kalender (Nicht-Kursdaten). Abweichung vom Konsens: der Markt behandelt den Lockup-Ablauf als Verkaufsanlass; die CBRS-Messung vom 2026-11-21 zeigt, dass der Abverkauf davor liegt (2026-11-05 Schluss 81,71 USD, tiefster Schluss in zwoelf Monaten, -11 % am Tag) und alle fuenf Schlusskurse nach dem Ablauftag hoeher lagen als am Vortag. Naechster datierter Testpunkt: Montag 2026-11-30, an dem vier Lockups aus demselben IPO-Tag 2026-06-03 ablaufen - INIO (Innio, Marktkap. bei IPO 20,25 Mrd. USD), QNT (Quantinuum, 15,66), LFTO (Liftoff Mobile, 3,83), SSMR (Sunshine Silver, 1,90), je 180 Tage (tickerlaunch.com, Abruf 2026-11-21; die Seite rechnet das Datum aus dem Prospekt, es ist keine bestaetigte Freigabe). Ausdruecke QNT und INIO gewaehlt, weil sie die beiden groessten des Clusters sind; LFTO und SSMR bleiben draussen (Groesse, und Silber ist
    ein eigener Treiber). Ethik: Innio baut Gasmotoren, Quantinuum Quantenrechner, kein Angriffswaffen-Kerngeschaeft erkennbar, Ruestungsumsatzanteil vor einer Karte zu belegen. OFFEN UND KARTEN-VORAUSSETZUNG: n=1 ist zu wenig. Vor einer Karte braucht es den im Falsifikat genannten Backtest ueber mindestens 15 Ablaeufe, sonst ist Punkt 1 nur eine Anekdote. Dazu ist zu pruefen, ob der Effekt nach Kosten und Spread in einem Markt mit VIX um 38 ueberhaupt handelbar ist.'
