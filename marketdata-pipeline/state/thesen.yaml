    ziel: 'Horizont-These: Erholung im Zyklus binnen 12 Monaten, kein festes Kursziel. Haltedauer ueber 1 Jahr macht Gewinne nach § 23 EStG steuerfrei (keine Steuerberatung).'
    notiz: 'EINSATZ-DECKEL 2026-11-24 (User, Chat: "Krypto: Einsatz max. 10000 EUR"): Groesse weiter nach der Risikoformel (1.000 EUR Risiko je Tranche bis BTC-EUR 46.000), aber der Gesamteinsatz der Karte (Tranche 1 + Tranche 2 zusammen) betraegt hoechstens 10.000 EUR; Tranche 2 hoechstens 10.000 EUR minus Einsatz Tranche 1. Greift der Deckel, sinkt das Risiko dieser Tranche unter 1 R (bewusst, Schutz gegen grosse Positionen direkt ueber dem Stop). Der Deckel greift bei Tranche 1 erst, wenn der Korbverlust bis 46.000 unter 10 % liegt, also etwa bei BTC-EUR unter rund 50.000. Annahme Claude: Deckel gilt fuer die Karte insgesamt, nicht je Tranche. || Budget (User 2026-11-20): 2 R a 1.000 EUR = 2.000 EUR Gesamtrisiko bis Preis-Falsifikat, getrennte Krypto-Karte, Kapital aus Kryptoverkaeufen. Gewichte: BTC 40 %, ETH 25 %, HYPE 20 %, AAVE 15 %. Korbverlust bis 46.000 EUR geschaetzt rund 23 % (BTC -17,7 %, Beta konservativ ETH 1,3, HYPE und AAVE 1,5, plus Kosten und Slippage). Tranche 1 = 1.000 EUR Risiko / 23 % = rund 4.350 EUR: BTC 1.740, ETH 1.090, HYPE 870, AAVE 650 (Stand 2026-11-20, bei Freigabe mit dem dann gueltigen Abstand neu rechnen). Tranche 2 laut zweite_haelfte, 1.000 EUR Risiko zum dann gueltigen Abstand. Voller Korb bei heutigem Abstand rund 8.700 EUR. Fill in karte.position eintragen (je Coin Stueck, Kurs EUR, Gebuehr). Ausserhalb des Gates: SOL-Altbestand (gestaked) korreliert mit BTC 0,84, das gesamte Krypto-Exposure steigt.'
    story: 'BTC fiel vom Hoch 124.753 USD (2025-10-06) bis 2026-06-30 auf 58.559 USD (-53,1 %), erholte sich bis Anfang Oktober (Wochenschluss 76.833 EUR am 2026-10-04) und faellt seit Mitte Oktober wieder: -26,9 % in 30 Tagen auf 61.455 USD bzw. 55.888 EUR am 2026-11-20, 4,9 % ueber dem Juni-Tief (Retest). Ausloeser: Spot-ETF-Abfluesse, Risk-off nach dem Anthropic-Boersengang und Zweifeln an KI-Investitionen, US-10J-Rendite 5,07 %, eingepreiste Fed-Erhoehung im Dezember. ETH -64 % vom Hoch 4.831 USD (2025-08-22), Glamsterdam auf fruehestens Mitte Januar 2027 verschoben. HYPE verdreifachte sich im Baerenmarkt vom Januar-Tief 20,97 auf 97,18 USD (2026-09-22) und liegt seither -36 %; Umsatz rund 69 Mio. USD in 30 Tagen, fast vollstaendig fuer Rueckkaeufe. AAVE -50 % vom 52W-Hoch, 180 Tage +38 PP besser als BTC, automatische Rueckkaeufe seit Aavenomics 3.0 (Juni 2026). Quellen: trading/Thesenkarte_KZT_Entwurf_2026-11-20.md.'
    gegenthese: 'Staerkstes Gegenargument: Retests eines Zwischentiefs im Baerenmarkt brachen in 5 von 7 Faellen um mehr als 10 % nach unten (Messung C), 2018 lag das finale Tief 51 % unter dem ersten Zwischentief, 2022 16 % (Messung D). Bei der Tiefe frueherer Zyklen (-77 bis -83 %) laege BTC bei 21.000-29.000 USD. Makro gegen Krypto: Zinsen steigen, Krypto faellt mit Tech. HYPE: Team-Unlocks im November geschaetzt 9,9 Mio. HYPE gegen Rueckkaeufe von rund 73 Mio. USD in 30 Tagen, also netto Verwaesserung. AAVE: Lending-Gebuehren Jan 2026 rund -41 % gegen Vorjahr. Nur teilweise eingepreist.'
