  note: 'User-Idee NEIN, Kandidat aus Abschnitt C des Thesen-Laufs 2026-11-21. Quellengruppe: Auktionen und Vergaben (Termin-Radar-Zeile 2026-11-26). Mechanik: zwei vergebene Gigawatt begruenden Bestellmengen fuer Turbinen, Seekabel und Installation mit langem Zeitversatz; die Vergabe selbst ist ein datiertes, aus einer erreichbaren Quelle feststellbares Ereignis. Ausdruecke bewusst auf die Lieferkette gelegt (VWS.CO Turbinen, PRY.MI und NEX.PA Kabel) statt auf die Bieter, weil die Marge bei den Bietern vom Gebotspreis abhaengt und damit gegenlaeufig sein kann. ORSTED.CO nicht aufgenommen: als moeglicher Bieter gegenlaeufig zum Zuschlagspreis. Punkt 6 der Checkliste ist offen, kein Ausdruck liegt im Sektor des Kern-Bestands. Noch ungeprueft und vor einer Karte zu klaeren: ob die Zuschlagsentscheidung ein datiertes Ereignis innerhalb von 6 Monaten ist (das Bewerbungsfenster ist es, die Entscheidung laut Radar nicht datiert) und wie gross der Auftragswert im Verhaeltnis zum Auftragsbestand
