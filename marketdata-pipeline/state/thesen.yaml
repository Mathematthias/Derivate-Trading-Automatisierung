- id: N2
  titel: UK-Ersterwerber (N-2)
  verdikt: beobachten
  korb_budget_pct: 0
  crowdedness_pp: -3.09
  re_check: '2026-12-01'
  falsifikat: '''Your First Home'' oeffnet die Vorregistrierung nicht bis 2026-12-31, ODER das Programm wird auf Bestandsimmobilien ausgeweitet bzw. vom Neubau geloest (damit faellt der mechanische Kanal zu den Neubau-Entwicklern), ODER der staatliche Eigenkapitalanteil sinkt unter 20 % -> verworfen.'
  ausdruecke:
  - PSN.L
  note: 'RE-CHECK 2026-10-29 faellig, hier erledigt. ALTES FALSIFIKAT WIDERLEGT, nicht eingetreten: Der Autumn Budget vom 2026-10-28 (Chancellor John Healey) hat ein beziffertes Ersterwerber-Paket gebracht - (1) ''Your First Home'' als Help-to-Buy-Nachfolger, NUR fuer Ersterwerber von NEUBAUTEN, staatliches Eigenkapitaldarlehen 20 %, fuenf Jahre zinsfrei, Eigenkapital 2,5-15 %, Haushaltseinkommen max. 110.000 GBP (140.000 GBP London), Preisdeckel 650.000 GBP Inner- und 500.000 GBP Outer-London, sonst Median der Kommune; Vorregistrierung bis Ende Dezember 2026, Antraege ab Februar 2027, erste Darlehen ab April 2027. (2) First-Time-Buyer-ISA ab April 2029, 4.000 GBP/Jahr, 25 % Bonus, Deckel 20.000 GBP, Objekt bis 450.000 GBP, keine Altersgrenze. (3) Lifetime-ISA-Strafe fuer Objekte ueber 450.000 GBP von 25 auf 20 % gesenkt, ab 2026-10-29 00:00. (4) Stamp Duty UNVERAENDERT, keine Entlastung. GEGENSEITE derselben These: Einkommensteuer auf Mieteinkuenfte ab April 2027 um weitere 2 Prozentpunkte
    auf 24/44/49 %, Mansion Tax ab April 2028 (2.500 GBP ab 2 Mio., 7.500 GBP ab 5 Mio.) - senkt die Vermieter-Nachfrage nach Neubau und erhoeht das Angebot an Ex-Mietbestand. Quelle which.co.uk und moneysavingexpert.com, Abruf 2026-10-31. WARUM TROTZDEM BEOBACHTEN und nicht spielen: Das Pflichtfeld katalysator der Karte verlangt ein Datum, und das Programm hat keines - ''bis Ende Dezember 2026'', ''ab Februar 2027'', ''ab April 2027'' sind Zeitfenster ohne Tag. Nach Routine 9 v82 Regel 3 bleibt eine These ohne vollstaendige Karte bei beobachten. Das ist der Grund, nicht die Handelbarkeit. Nebenbefund, nach Schritt 4c ausdruecklich KEIN Thesenargument: der Markt hatte die Nachricht am 2026-10-28 und hat die Bauwerte nicht neu bewertet - PSN.L 12,455 (+0,52 % am 10-30), 30d -0,20 %, 52W-Hoch -19,75 %, Crowdedness -3,09 PP gegen ^FTSE (n=1, die Stichprobe traegt die Zahl nicht); TW.L laeuft im Digest als SHORT-Pitch (bearish, unter 3 von 4 EMAs) - ein Wert kann nicht in beiden Richtungen laufen,
    das ist ein Befund fuer Block 5. Neuer Re-Check 2026-12-01: dann muss ein fester Vorregistrierungstermin publiziert sein. Kurswerte Digest BRIEFING-DIGEST-2026-10-30-2234.json (generated 2026-10-30 22:34 CET, as_of 2026-10-30).'
