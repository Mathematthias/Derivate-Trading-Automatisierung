  note: 'NEU, Thesen-Lauf 2026-10-31. Kandidat aus GRUPPE 2 (Regulierungs- und Fristenkalender; Radar Z20). Treiber: Am 2026-11-10 laufen 178 US-Section-301-Ausnahmen aus, davon 164 produktspezifische und 14 fuer Solarfertigungs-Equipment; eine neue Antragsrunde ist nicht offen. Kausalkette: der Zoll auf Fertigungsanlagen erhoeht die Investitionskosten fuer NEUE US-Solarfabriken, die chinesische Anlagentechnik einsetzen - relativer Vorteil fuer bereits ausgeruestete heimische Fertiger, Belastung fuer Ausbauprojekte mit chinesischem Equipment. 4b: gerichtet erfuellt, falsifizierbar erfuellt, mechanisch-direkt NUR EINGESCHRAENKT - die GEGENTHESE steht in derselben Mechanik: ein Zoll auf Anlagen verteuert jeden Kapazitaetsausbau, auch den der heimischen Fertiger selbst, sodass der relative Vorteil nur fuer bereits abgeschlossene Investitionen gilt. Diese Ambivalenz ist der Grund fuer beobachten. KEIN benannter Wert im Universum: FSLR, SEDG, WCH.DE und NXT fehlen alle, Crowdedness nicht messbar,
    ausdruecke leer (Vehikelfrage nach der Reform 2026-08-04, kein Ausschlussgrund). Naechster Pruefschritt: USTR-Primaerquelle zur Ausnahmeliste und zum Fehlen einer Antragsrunde (bisher nur die Radar-Zeile), danach Pruefung, welcher Fertiger ueberhaupt ohne chinesisches Equipment ausbaut. Re-Check 2026-11-11, Tag nach dem Ereignis. Liegt im Cluster 2026-11-10 (Z81, Z95, Z115, N6).'
