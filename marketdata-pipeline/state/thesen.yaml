- id: N2
  titel: UK-Ersterwerber (N-2)
  verdikt: beobachten
  korb_budget_pct: 0
  crowdedness_pp: 9.39
  re_check: '2026-10-29'
  falsifikat: Autumn Budget 2026-10-28 bringt kein Ersterwerber-Programm mit bezifferter Foerderung (First-Time-Buyer-ISA-Bonus, Stamp-Duty-Entlastung oder Nachfolger von Help-to-Buy) -> verworfen
  ausdruecke: []
  note: 'Falsifikat erstmals gesetzt - die These lief seit Anlage mit leerem Kriterium und verletzte damit Gate 3 des Konviktions-Gates. Belegt: FTB-ISA-Konsultation am 2026-08-18 geschlossen, Ergebnis unveroeffentlicht, Bonushoehe/Jahreslimit/Preisdeckel auf ''a future fiscal event'' verschoben = der Termin 2026-10-28; Stamp-Duty-Aenderungen bisher nicht angekuendigt, jaehrliche Grundsteuer fuer diesen Haushalt ausgeschlossen (Richify-Budget-Tracker, Abruf 2026-10-10, Sekundaerquelle, confidence mittel). Crowdedness PSN.L 30d +8,85 % gegen ^FTSE -0,54 % = +9,39 PP, n=1 - die Stichprobe traegt die Zahl nicht. Re-Check 2026-10-29 liegt bewusst einen Tag nach dem Haushalt.'
