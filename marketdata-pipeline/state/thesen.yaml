  - MAERSK-B.CO
  note: 'NEU, Thesen-Lauf 2026-10-31. Kandidat aus GRUPPE 2 (Regulierungs- und Fristenkalender; Radar Z81). Treiber: Am 2026-11-10 werden die USTR-Section-301-Hafengebuehren auf chinesisch gebaute oder betriebene Schiffe (Annex I/II) und auf Nicht-US-Autotransporter (Annex III) wieder faellig; zeitgleich endet die Aussetzung der chinesischen Gegen-Hafengebuehren auf US-Schiffe. Die Aussetzung lief vom 2025-11-10 bis 2026-11-09, eine Verlaengerung ist nicht publiziert. Kausalkette: Gebuehr je US-Hafenanlauf nach Nettotonnage = unmittelbare Betriebskostenposition, daraus relativer Vorteil fuer Flotten ohne China-Bau auf US-Routen und Belastung US-verbundener Schiffe in chinesischen Haefen. KONVIKTIONS-GATE 4b: (1) gerichtet erfuellt, (2) mechanisch-direkt NUR AUF SEKTORENEBENE erfuellt - JE WERT NICHT, weil der Anteil chinesisch gebauter Tonnage an den Flotten von SBLK und Maersk ungeprueft ist; die Radar-Zeile sagt das selbst (''Tickerliste illustrativ, Flottenanteil je Wert ungeprueft'').
    Ohne diese Zahl ist die Richtung je Name nicht bestimmbar, und genau deshalb beobachten statt spielen. (3) falsifizierbar erfuellt. Im Universum nur zwei Werte: SBLK 28,36 (neutral, unter EMA20 29,05 und EMA50 29,31, ueber EMA100 28,56 und EMA200 26,58, RSI 41,0, ATR 2,90 %, 30d -6,8 %, Earnings 2026-11-18) und MAERSK-B.CO 23.070 (bullisch, ueber 3 von 4, unter EMA20 23.602,78, RSI 45,3, 30d -1,24 %, Earnings 2026-11-05 = in 5 HT, Earnings-Disqualifier). HLAG.DE, ZIM, GOGL, WAWI.OL nicht im Universum - nach der Reform vom 2026-08-04 eine Vehikelfrage, kein Ausschlussgrund. Crowdedness: SBLK -6,8 gegen ^GSPC -1,13 = -5,67; MAERSK-B.CO -1,24 gegen ^STOXX50E -0,71 = -0,53 (Proxy, kein daenischer Index im Universum), Mittel -3,10 PP, n=2 - Zone ohne Deckel, aber die Stichprobe traegt die Zahl kaum. NAECHSTER PRUEFSCHRITT vor jeder Hochstufung: Anteil chinesisch gebauter Tonnage je Flotte aus den Geschaeftsberichten, und USTR-Primaerquelle zur Nicht-Verlaengerung. Re-Check 2026-11-09, einen
    Tag vor dem Ereignis. Das Datum liegt im Cluster 2026-11-10 mit Z20, Z95, Z115 und dem Ablauf der SE-Aussetzung (These N6) - fuenf datierte Ereignisse an einem Tag. Kurswerte Digest BRIEFING-DIGEST-2026-10-30-2234.json (generated 2026-10-30 22:34 CET, as_of 2026-10-30).'
