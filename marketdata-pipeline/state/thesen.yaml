- id: N6
  titel: Seltene Erden - Ablauf der Aussetzung 2026-11-10
  verdikt: verworfen
  re_check: '2026-11-28'
  crowdedness_pp: -22.34
  korb_budget_pct: 0
  falsifikat: Die MOFCOM-Primaerquelle (mofcom.gov.cn/zcfb/blgg/gg/2026) zeigt bis zum 2026-11-28 eine - auch rueckwirkende - Verlaengerung oder dauerhafte Aufhebung von Announcement 70/2025, ODER die Primaerquelle laesst sich bis dahin nicht lesen und der Rechtsstand nach dem 2026-11-10 bleibt unbelegt -> in beiden Faellen verworfen.
  note: 'THESEN-LAUF 2026-11-14, NACHTRAG 12:26 - KORREKTUR DES EIGENEN BEFUNDS VON 09:21. FALSIFIKAT EINGETRETEN, erste Haelfte, VERWORFEN. China HAT die Aussetzung verlaengert, und zwar am 2026-11-09, also VOR dem 2026-11-10: MOFCOM-Bekanntmachung (laut Shanghai Metals Market ''Announcement No. 58 of 2026'', Artikel vom 2026-11-09 16:43 GMT+8) verlaengert die Aussetzung aus Announcement 70/2025 vom 2026-11-11 bis 2027-01-10 und erfasst ausdruecklich die Announcements 55, 56, 57 und 58 von 2025 sowie 61 und 62 von 2025. Announcement 61, die 0,1-%-Regel fuer Magnete, bleibt damit AUSGESETZT - genau das, was die erste Falsifikat-Haelfte beschreibt. Bestaetigt von techtimes.com 2026-11-10 05:44 EST (''remains suspended'', Verlaengerung am Montag 2026-11-09 angekuendigt, Geltung ab 2026-11-11 Pekinger Zeit), das sich auf Reuters stuetzt. Abruf 2026-11-14. EINSCHRAENKUNG: der chinesische Originaltext ist nicht gelesen, die Bekanntmachungsnummer stammt aus einer Sekundaerquelle. WARUM DER LAUF
    UM 09:21 DAS VERFEHLT HAT: Die drei dort erreichbaren Quellen datierten alle auf den 2026-11-09 oder davor, darunter ein techtimes-Artikel vom 2026-11-09 mit dem Titel ''Beijing Has Published No Extension'' - er wurde vom selben Medium Stunden spaeter ueberholt, und die Suchen am Morgen haben die neuere Fassung nicht gefunden. Der Lauf hatte das als ''Rechtsstand nach dem 2026-11-10 unbelegt'' festgehalten und eine Frist bis 2026-11-28 gesetzt; die Frist ist damit erledigt, das Ergebnis ist das Gegenteil der Vermutung. NACHRUF: Gedacht war, dass die am 2026-11-10 auslaufende Aussetzung die chinesischen Exportkontrollen wieder scharf macht und Nicht-China-Foerderern einen datierten regulatorischen Vorteil verschafft. Passiert ist eine Verlaengerung um zwei Monate, einen Tag vor dem Termin - dieselbe Mechanik und fast derselbe Tag wie bei N8 und N10, deren USTR-Fristen ebenfalls am 2026-11-09/10 final verlaengert wurden. Gelernt: Fristen, die an der US-China-Truce haengen, laufen nicht
    aus, sie werden mitgezogen; das ist jetzt dreimal in einer Woche am selben Muster gemessen, und der neue gemeinsame Termin ist der 2027-01-09/10. Kein Kapital gebunden. Zusatzbefund: der Kandidat ''Seltene Erden'' aus Abschnitt C desselben Laufs ist damit in der Praemisse widerlegt - er war am 7/7-Gate an den Pflichtpunkten 1, 3 und 4 gescheitert, was sich im Rueckblick als richtig erweist.'
