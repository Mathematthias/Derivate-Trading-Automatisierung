  budget_r: 2
  starter_anteil: 0.5
  karte:
    konsens: 'Der Markt bestraft die AI-Ausgaben: Alphabet haelt die Capex 2026 bei 195-205 Mrd. USD, kuendigt fuer 2027 einen deutlichen Anstieg an, FCF Q3 -9,1 Mrd. USD, vorboerslich ~-10 % (2026-10-29). Halbleiter-Cluster im Median -26 % zum 52W-Hoch (Digest 2026-10-29).'
    abweichung: Die Capex wird nicht gekuerzt, sondern erhoeht (META 2026-10-21, Alphabet 2026-10-28). Fuer die Zulieferer ist das gesicherter Umsatz; der Halbleiter-Abschlag preist einen Capex-Cut ein, der nicht kommt. Fuer die Ausgeber (META, GOOGL) ist dieselbe Nachricht eine Last - deshalb nur Zulieferer im Korb.
    katalysator:
    - date: '2026-11-03'
      ereignis: AMD Q3
    - date: '2026-11-17'
      ereignis: NVDA Q3 (Hauptmesspunkt)
    thesen_falsifikat: Ein Big-5-Hyperscaler kuerzt die Capex-Guidance 2026/27, oder NVDA guidet am 2026-11-17 unter Konsens.
    preis_falsifikat:
      symbol: ^IXIC
      op: <
      level: 25221.05
      text: EMA200-1D, Stand 2026-10-30 (Vorstand 25.213,37 vom 2026-10-28; die EMA200 steigt, der Abstand wird enger). ^IXIC 25.436,998 = +0,86 % / 0,53 ATR darueber. Je Vehikel zusaetzlich Stop an eigener Struktur.
    horizont: '2026-12-02'
    vehikel:
    - ASML.AS
    - NVDA
    zweite_haelfte: nach NVDA 2026-11-17 ohne Falsifikat, oder frueher bei 1D-Schluss des Vehikels ueber seiner EMA50
    ziel: Rueckkehr Richtung 52W-Hoch je Vehikel; Teilgewinn an der ersten starken Marke (sr-Zonen)
    notiz: 'Katalysator AMZN 2026-10-29 erledigt: kein Cut, Q3-Capex 77,3 Mrd. USD gegen 58,7 Mrd. Konsens, FY26 rund 220 Mrd. gehalten, 2027 ''meaningfully more'' - Falsifikat (a) damit an allen vier Big-5-Berichten widerlegt. STARTER-RECHNUNG 2026-10-31 (1 R = 150 EUR, je Vehikel 0,5 R): ASML.AS 1.412,80, Stop an EMA200-1D 1.367,86 = -3,18 % -> rund 2.358 EUR; NVDA 204,64, EMA200 205,79 ist bereits unterschritten (-0,56 %), naechste Struktur rc20-Untergrenze 198,39 = -3,05 % -> rund 2.456 EUR; Summe rund 4.814 EUR gegen Spur-Deckel 6.746 EUR (50 % von disponibel 13.492,24). Der Starter ist also sizebar - aber das Thesen-Kill-Switch liegt 0,53 ATR entfernt und NVDA hat seine eigene EMA200 schon verloren. Entscheidung des Users: Starter jetzt, Preis-Falsifikat an eine weiter entfernte Struktur legen (hoehere Verlusttoleranz der These), oder Abstand abwarten.'
  nachruf:
    datum: '2026-11-09'
    text: 'Gedacht war, dass der AI-Capex nicht gekuerzt wird und die Zulieferer zu billig sind. Der ASML-Starter wurde ausgestoppt (-0,92 R), ^IXIC schloss am 2026-11-02 unter der EMA200, das Verdikt kam erst am 2026-11-07, das Thesen-Falsifikat trat nie ein. Gelernt: Ein Kill-Switch 0,5 ATR unter Kurs ist fuer eine Mehrmonats-These zu eng, und ein Preis-Falsifikat muss am selben Tag zum Verdikt fuehren.'
