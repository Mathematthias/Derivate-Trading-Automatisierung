- id: N4
  titel: Euro 7 Typgenehmigungs-Stichtag 2026-11-29
  verdikt: verworfen
  re_check: '2026-11-21'
  crowdedness_pp: null
  korb_budget_pct: 0
  falsifikat: Kommission verschiebt den Stichtag oder entschaerft die Brems-/Reifenabriebgrenzwerte per Uebergangsfrist bzw. die Durchfuehrungsrechtsakte zum Abriebmessverfahren liegen am 2026-11-29 nicht vor -> verworfen
  note: 'THESEN-LAUF 2026-11-21: VERWORFEN beim faelligen Re-Check (2026-11-21). NACHRUF: Gedacht war, der Euro-7-Stichtag 2026-11-29 bringe erstmals Brems- UND Reifenabriebgrenzwerte fuer neue Typgenehmigungen von Pkw und leichten Nutzfahrzeugen und damit eine datierte Nachfrage nach Abriebtechnik. Passiert ist: der Stichtag gilt unveraendert und das Bremsabrieb-Messverfahren liegt vor (Delegierte VO (EU) 2026/1214, erlassen 2026-06-09, Amtsblatt 2026-09-03, ersetzt die UN-GTR 24 durch UN-Regelung Nr. 179; bestaetigt ADAC Stand 2026-09-23), aber die REIFENABRIEB-HAELFTE DER PRAEMISSE WAR FALSCH: Reifenabriebgrenzwerte gelten laut VO (EU) 2024/1257 Art. 11/21 erst ab 2028-07-01 (C1), C2 ab 2030-04-01, C3 ab 2032-04-01, und der EU-Rechtsakt dazu fehlt noch (Art. 15 Abs. 2 setzt die Frist 2027-07-01). Die Bremsgrenzwerte treffen bis 2029-12-31 nur neue Typen mit 3 mg/km PM10 (BEV) bzw. 7 mg/km, Vollanwendung erst 2027-11-29; die Werte fuer 2030-2034 sind im Verordnungstext noch leer. Verschiebungsforderungen
    existieren (ACEA-Brief an MEPs 2026-10-20), betreffen aber schwere Nutzfahrzeuge, sind rechtlich nicht umgesetzt, und der Automotive Omnibus ist noch Vorschlag (Plenumsposition erwartet 2026-12-14, Trilog erst 2027). ZWEITER GRUND FUER DAS VERWERFEN, und er traegt allein: die These stand seit dem 2026-10-12 ohne einen einzigen handelbaren Ausdruck in beobachten, crowdedness daher dauerhaft ''nicht messbar'' (fehler: keine Ausdruecke), Punkt 4 des Gates dauerhaft nicht erfuellt - sie konnte strukturell nie eine Karte werden. GELERNT: ein Regulierungsdatum ist erst dann eine These, wenn ein notierter Wert benannt ist, dessen Umsatzlinie sich an diesem Datum mechanisch bewegt; der Ausdruck ist VOR der Aufnahme in die Liste zu pruefen, nicht danach. Zweitens: Stichtage aus Sekundaerquellen sind gegen den Verordnungstext zu pruefen - hier haette Art. 21 die Reifenhaelfte sofort widerlegt. ABWEICHUNG VON DER REGEL (Regel 25): das formale Falsifikat ist nicht eingetreten (Stichtag haelt, Bremsrechtsakt
    liegt vor); verworfen wird wegen fehlendem Vehikel und falscher Praemissenhaelfte. Quellen: eur-lex.europa.eu OJ:L_202401257, boe.es/doue/2026/1214, adac.de/euro-7, ricardo.com Euro-7-FAQ, acea.auto ACEA-letter-to-MEPs-Euro-7-HDV-brakes.pdf, ertico.com 2026-11-03, alle Abruf 2026-11-21.'
