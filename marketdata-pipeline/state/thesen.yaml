  falsifikat: 'Brent-Schluss (BZ=F) < 88 USD ODER Waffenruhe bzw. formelle Deeskalationsvereinbarung USA-Iran. ZUSATZ 2026-11-07: ein 1D-Schluss unter 88 beendet die These sofort, ohne auf den Re-Check zu warten.'
  ausdruecke:
  - VLO
  - MPC
  - XOM
  - PSX
  note: 'THESEN-LAUF 2026-11-14: Re-Check 2026-11-13 hier erledigt, BEIDE FALSIFIKAT-HAELFTEN GEPRUEFT UND NICHT EINGETRETEN. (1) Brent 95,50 USD am 2026-11-13 = +8,52 % ueber der Schwelle 88 (hdfcsky.com ''Brent slips 0,3 % to 95,5 per barrel as oil heads for second weekly decline'', 2026-11-13; Vorwoche 97,87). (2) KEINE Waffenruhe und keine formelle Deeskalationsvereinbarung: Al Jazeera schreibt am 2026-11-12 woertlich ''full-scale fighting remains on hold, but a formal peace deal is still out of reach''; Irans Chefunterhaendler Ghalibaf nennt sieben Bedingungen (Aufhebung der US-Seeblockade, Sanktionserleichterungen, Freigabe eingefrorener Gelder, formelles Kriegsende) und sagt ''the ball is now in the American court'', Aussenminister Rubio nennt die Forderungen ''unacceptable''. Das Islamabad-Memorandum vom 2026-06-17 lief auf 60 Tage; eine Verlaengerung ist in den gelesenen Quellen nicht belegt. PHYSISCHE STOERUNG VERSCHAERFT SICH: laut Reuters/Kpler (via Al Jazeera 2026-11-12) querten
    am 2026-11-07 nur fuenf Rohstoffschiffe die Strasse und am 2026-11-08 keines, gegen 31 in der Vorwoche; die IRGC meldet eine Explosion, die zwei Supertanker mit ueber vier Millionen Barrel auf einer nicht autorisierten Route stoppte. VERDIKT UNVERAENDERT beobachten, Grund wie am 2026-11-07 formal: das Pflichtfeld katalysator braucht ein Datum, und die sieben iranischen Bedingungen haben keinen Tag; die naechsten datierten Punkte der Ausdruecke sind Earnings im Januar/Februar 2027. CROWDEDNESS nicht messbar (keine Kursquelle im Container); letzter belegter Wert -8,95 PP vom 2026-11-07.'
