  note: 'THESEN-LAUF 2026-11-14, NACHTRAG 12:26: Re-Check 2026-11-28 unveraendert, kein Verdiktwechsel - aber die Erwartung hat sich gedreht. Die chinesische Verlaengerung vom 2026-11-09 (Aussetzung von Announcement 70/2025 bis 2027-01-10) nennt die Announcements 55, 56, 57, 58, 61 und 62 von 2025; Announcement 72/2025, an dem diese These haengt, wird in den gelesenen Quellen NICHT erwaehnt (SMM 2026-11-09, techtimes 2026-11-10, Abruf 2026-11-14). Nach dem Muster der Woche - USTR verlaengerte am 2026-11-09/10, China am 2026-11-09, alle neuen Fristen liegen auf dem 2027-01-09/10 - ist eine Verlaengerung auch fuer 72/2025 vor dem 2026-11-27 der wahrscheinlichere Fall, womit das Falsifikat dieser These eintreten wuerde. Vor dem Re-Check ist die MOFCOM-Primaerquelle (mofcom.gov.cn/zcfb/blgg/gg/2026) zu lesen; die Sekundaerquellen haben in diesem Lauf einmal in die Irre gefuehrt.'
