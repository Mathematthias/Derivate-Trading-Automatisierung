  karte:
    konsens: 'Wiederholung von 2022: Baerenmarkt bis ins Jahr 2027, BTC-Boden erst bei 40.000-45.000 USD (Willy Woo laut Cointelegraph). Stimmung: Fear & Greed 12 am 2026-11-19, Spot-BTC-ETFs im November bis 2026-11-16 rund -2,1 Mrd. USD, am 2026-11-19 BTC/ETH/SOL-ETFs zusammen -715 Mio. USD.'
    abweichung: 'Zeitlich ist der Boden faellig, preislich vielleicht schon gesehen. In den zwei vollstaendig messbaren Zyklen lag das finale Tief 364 bzw. 378 Tage nach dem Hoch; heute sind es 410 Tage, das Zwischentief vom 2026-06-30 lag bei -53,1 %. Die Tiefe der Baerenmaerkte nahm ab (-83 %, -77 %, bisher -53 %). 13 Monate nach dem Hoch stand BTC 6 Monate spaeter +161 % bzw. +54 % und 12 Monate spaeter +143 % bzw. +156 % (n = 2, Messung 2026-11-20). Halving-Phase 30-36 Monate: BTC im Mittel +12,5 % je Monat, 74 % positive Monate (Messung 2026-11-12, an denselben Zyklen abgelesen).'
