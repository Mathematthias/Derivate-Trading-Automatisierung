    notiz: 'ETN bis 2026-11-03 per Earnings-Disqualifier aus den Vehikeln heraus. KEIN benannter UCITS-Netz-/Elektrifizierungs-ETF - die Spur bevorzugt ETFs, hier bleiben es 3 Direktaktien, weil kein Produkt belegt benannt werden kann (nichts erfunden). KOPPLUNG: Falsifikat (a) ist identisch mit dem der These TECH; nach L7 sind A und TECH EIN Risikoblock. A und TECH zusammen fuellen die Spur vollstaendig (2 von 2 Thesen, 4 von 4 R) auf einem einzigen Treiber - ob beide einen Starter tragen, ist eine Entscheidung des Users, nicht dieses Laufs.'
