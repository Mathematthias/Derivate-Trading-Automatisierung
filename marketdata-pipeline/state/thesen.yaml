  note: 'THESEN-LAUF 2026-11-21: BEIDE FALSIFIKATE GEPRUEFT UND NICHT EINGETRETEN, GATE-PUNKT 4 JETZT MIT PIPELINE-ZAHL ERFUELLT, VERDIKT TROTZDEM UNVERAENDERT beobachten. (1) Thesen-Falsifikat Haelfte MSTR: kein BTC-Verkauf, im Gegenteil, Strategy kaufte zuletzt 485 BTC fuer 33,4 Mio. USD (bitcoinmagazine.com, cryptotimes.io 2026-11-16) und davor 1.036 BTC fuer 81,9 Mio. USD, bei gleichzeitigem Rueckkauf von STRC-Vorzugsaktien; Papierverlust rund 6,85 Mrd. USD bei einem Durchschnittskurs um 75.000 USD (cryptotimes.io 2026-11-14). Haelfte Stablecoin: kein Tagesschluss von USDT oder USDC unter 0,97 USD in den geprueften Quellen. (2) Preis-Falsifikat: BTC-EUR-Schluss 53.229,59 EUR am 2026-11-21 gegen 46.000 = +15,72 % ueber dem Level, erreicht=false; von hier braucht es -13,58 %. Einstiegszone unter 60.000 ist erreicht, erstmals 2026-11-21 (state/thesen_preise.json). GEGEN DIE THESE SPRICHT DIESE WOCHE DEUTLICH MEHR ALS DAFUER, und das gehoert in die Karte: BTC fiel am 2026-11-20 um -5,18
    % auf 58.282 USD, unter 59.000 und damit auf den tiefsten Stand seit Juli, -23 % im November, laut Schlagzeile der schlechteste Monat seit Juni 2022 (Yahoo Finance 2026-11-20). BTC-EUR 53.229,59 liegt nur +3,75 % ueber dem Juni-Tief 51.308 - das ist genau die Vorwarnmarke des Bear-Szenarios der Karte, und die Gegenthese (Retests eines Zwischentiefs brachen in 5 von 7 Faellen um mehr als 10 % nach unten) laeuft derzeit. Dazu ein Nicht-Kursbefund, der die These direkt angreift: das Stablecoin-Angebot schrumpfte um 14,2 Mrd. USD, die groesste Kontraktion seit dem Baerenmarkt 2022 (theblock.co 2026-11-11), Marktkapitalisierung -21 Mrd. USD seit dem Mai-Hoch, USDT-Verkaeufe fluteten Curve- und Uniswap-Pools - Stablecoin-Angebot ist das trockene Pulver des Kryptomarkts, und es nimmt ab. Krypto fiel diese Woche mit Tech, die Korrelation zum Abverkauf ist sichtbar (vgl. TDIP). CROWDEDNESS gate_pp -18,04 PP (Zone frisch, n=4; BTC-EUR -15,62, ETH-EUR -19,99, HYPE -13,17, AAVE -23,37, je gegen
    ^GSPC -10,92 %, Fenster 2026-10-22 bis 2026-11-21); mittelwert_pp -28,96 PP; keine Vorwoche, erste Pipeline-Messung. Die eigene Vorschau-Rechnung der Karte lag bei -20,7 PP, die Pipeline sagt -18,04 - die Vorschau war also zu pessimistisch und Punkt 4 ist jetzt mit der maßgeblichen Zahl erfuellt, nicht mehr nur vorlaeufig. WARUM TROTZDEM KEIN freigabe IN DIESEM LAUF: die Regel aus der Kartenlogik (Thesen-Lauf 2026-11-14) will, dass ein Kandidat eine Woche ueberlebt, bevor Kapital an ihm haengt; der Eintrag vom 2026-11-20 nennt den 2026-11-28 ausdruecklich als fruehesten kartenfaehigen Lauf. Diese Woche ist noch nicht um, KZT ist erst einen Tag alt. Mechanisch ist das Gate jetzt vollstaendig (6/7, Pflichtpunkte 1, 3, 4 erfuellt), das heisst: der Lauf am 2026-11-28 kann freigabe setzen, und der User kann jederzeit im Chat selbst freigeben - der Eintrag vom 2026-11-20 sieht diese Ausnahme ausdruecklich vor. GROESSEN-WARNUNG, falls er das tut: Tranche 1 war am 2026-11-20 mit 4.348 EUR gerechnet
    (1.000 EUR Risiko / 23 % Korbverlust bis 46.000). Mit dem heute kleineren Abstand (BTC -13,58 % statt -17,7 %) ergibt dieselbe Rechnung rund 5.666 EUR - die Risikoformel verlangt also eine GROESSERE Position, je naeher der Stop kommt. Das ist formal richtig und psychologisch die Falle: naeher am Stop heisst hoeherer Einsatz bei hoeherer Stop-Wahrscheinlichkeit. Vor einer Freigabe neu rechnen und bewusst entscheiden, ob die Formel oder ein Deckel gilt.'
