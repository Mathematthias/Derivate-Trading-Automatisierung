  titel: AI-Capex-Zulieferer (Halbleiter)
  verdikt: verworfen
  korb_budget_pct: null
  crowdedness_pp: -18.0
  re_check: '2026-11-18'
  falsifikat: '(a) Hyperscaler-Capex-Cut: weiterhin WIDERLEGT (META 2026-10-21 angehoben, Alphabet 2026-10-28 gehalten plus 2027-Anstieg, AMZN 2026-10-30 Q3-Capex 77,3 Mrd. USD / FY26 rund 220 Mrd. gehalten). (b) PREIS-FALSIFIKAT EINGETRETEN: ^IXIC-Schluss 2026-11-06 24.579,42 gegen Karten-Level 25.221,05 = -641,63 Punkte bzw. -1,24 ATR-1D (ATR 518,88), zugleich -2,54 % unter der aktuellen EMA200-1D 25.219,42 (Digest 2026-11-06 22:33).'
  ausdruecke:
  - ASML.AS
  - NVDA
  note: 'Preis-Falsifikat gebrochen, nach references/thesen-spur.md nicht verhandelbar - Verdikt verworfen, obwohl das Thesen-Falsifikat weiter widerlegt ist und NVDA Q3 am 2026-11-17 noch aussteht. KORREKTUR 2026-11-09 (Journal #18 AV, A-018): Starter ASML.AS 1 Stk am 2026-10-29 zu 1.505,00 EUR eroeffnet, am 2026-11-03 im Gap zu 1.367,20 EUR ausgestoppt, -137,80 EUR = -0,92 R; die fruehere Angabe, es sei kein Starter eroeffnet worden, war falsch. der am 2026-10-31 gerechnete Starter waere in BEIDEN Vehikeln ausgestoppt worden (ASML.AS 1.283,60 unter Stop 1.367,86 / NVDA 186,64 unter Stop 198,39). Ein Nachfolger mit weiter gelegtem Kill-Switch ist eine Entscheidung des Users und braucht eine NEUE id mit neuer Karte - das Kill-Switch einer getroffenen These nachtraeglich zu verlegen ist genau das Festhalten, das die Spur verbietet.'
