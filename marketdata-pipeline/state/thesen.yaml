    / PWR -14,04 (gegen ^GSPC -1,04), ABBN.SW -12,54 / PRY.MI -15,76 (gegen ^STOXX50E -3,26), Mittel -14,52 PP (Vorwoche -3,42) - Unterperformance, nach der Zonenregel also Raum, kein Deckel. ABWEICHUNG benannt (Regel 25): Schritt 4c verbietet den Chart als Thesenargument; die Herabstufung stuetzt sich allein auf Messkalender und Earnings-Sperre. Gegenprobe: These STAHL bleibt unter denselben Chartbedingungen spielen, weil ihr Messtermin 19 Tage entfernt ist.'
