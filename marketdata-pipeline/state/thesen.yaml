- id: N4
  titel: Euro 7 Typgenehmigungs-Stichtag 2026-11-29
  verdikt: beobachten
  re_check: '2026-11-21'
  crowdedness_pp: null
  korb_budget_pct: 0
  falsifikat: Kommission verschiebt den Stichtag oder entschaerft die Brems-/Reifenabriebgrenzwerte per Uebergangsfrist bzw. die Durchfuehrungsrechtsakte zum Abriebmessverfahren liegen am 2026-11-29 nicht vor -> verworfen
  note: 'Kandidat aus Gruppe 2 (Regulierungs-/Fristenkalender, Radar Z23, CATALYST-CALENDAR 2026-10-10). VO (EU) 2024/1257 gilt ab 2026-11-29 fuer neue Typgenehmigungen Pkw/leichte Nutzfahrzeuge und bringt erstmals Grenzwerte fuer Brems- und Reifenabrieb. Kausalkette: Stichtag am Inverkehrbringen -> Content-per-Vehicle bei Abriebminderung und Abgasnachbehandlung steigt, Vorzieheffekt davor. Genannte Werte UMI.BR, JMAT.L, BAS.DE, CON.DE, ML.PA, TYRES.HE - KEINER im Universum, Crowdedness nicht messbar. VORBEHALT: Datum und Abriebgrenzwerte stehen nur im Kalender-Seed (EUR-Lex 2024/1257, Abruf 2026-08-04), Primaerquelle nicht gegengelesen - vor jeder Vertiefung Artikel und Anhang pruefen. Gleiche Schwaeche wie K-3 am 2026-10-03: ein Vorzieheffekt ist aus veroeffentlichten Zahlen kaum von Saisonalitaet zu trennen.'
