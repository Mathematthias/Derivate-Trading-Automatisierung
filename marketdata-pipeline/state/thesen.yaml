  note: 'NEU, Thesen-Lauf 2026-10-24, Sonderauftrag S4 (Weg C: Ausdrueckbarkeit zuerst). Kandidat aus Gruppe 2 (Regulierungs-/Fristenkalender; Radar Z30, Z96, Z114, CATALYST-CALENDAR 2026-10-24). Treiber: Medicare-Verhandlungspreise Runde 2 werden am 2027-01-01 wirksam - 15 Wirkstoffe, im Schnitt -44 % gegenueber dem 2024-Listenpreis, Semaglutid rund -70 % (Z30, biopharmadive.com, Abruf 2026-08-04); dazu am 2026-11-30 die gesetzliche CMS-Frist fuer die Hoechstpreise der dritten Runde (Z96) und das GLOBE-Referenzpreismodell (Z114). Kausalkette: niedrigere ausgehandelte Preise senken die Part-D-Leistungsausgaben der groessten Plansponsoren unmittelbar -> Medical Loss Ratio runter -> Ergebnis rauf. GRENZE DER THESE ausdruecklich benannt: der Effekt ist erstrangig nur im Part-D-Buch, und Part D ist ein kleiner Teil des Gesamtkostenblocks von UNH und ELV, der von der Leistungsinanspruchnahme dominiert wird - Gate 2 (mechanisch-direkt) ist in der Art erfuellt, in der Groessenordnung schwach. Das
    ist eine Einschaetzung, kein Messwert, und deshalb beobachten statt spielen. EINZIGER Kandidat dieses Laufs, dessen Ausdruecke den S4-Filter heute erfuellen: UNH 418,09 ueber allen vier EMAs, Stack bullisch, RSI 66,0, ATR 2,73 %, Ext 1,84 ATR (Gate 1 frei), Earnings 2027-01-12; ELV 439,95 ueber allen vier EMAs, Stack bullisch, RSI 66,3, ATR 2,60 %, Ext 1,60 ATR, Earnings 2027-01-28 (Digest 2026-10-23 22:33). Crowdedness 30d gegen ^GSPC -1,04: UNH +12,53 / ELV +11,51 PP, Mittel +12,02 PP = Zone 10-20, also bei einer spaeteren Hochstufung Groesse eine Stufe tiefer. Re-Check 2026-12-01 nach der CMS-Frist. Naechster Pruefschritt: Primaerquelle CMS zur Runde-2-Wirkstoffliste und zum GLOBE-Modell gegenlesen - bisher nur Sekundaerquellen aus dem Katalysator-Kalender.'
