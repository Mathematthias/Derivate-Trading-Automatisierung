- id: N8
  titel: US-Hafengebuehren auf China-Tonnage - Ablauf der Aussetzung 2026-11-10
  verdikt: verworfen
  re_check: '2026-11-10'
  crowdedness_pp: -12.64
  korb_budget_pct: 0
  falsifikat: USTR verlaengert die Aussetzung der Section-301-Hafengebuehren vor dem 2026-11-10, ODER China verlaengert die Aussetzung der Gegen-Hafengebuehren, ODER die Pruefung der Flottenzusammensetzung ergibt fuer die benannten Werte keinen wesentlichen Anteil chinesisch gebauter bzw. betriebener Tonnage -> verworfen.
  ausdruecke:
  - SBLK
  - MAERSK-B.CO
  note: 'THESEN-LAUF 2026-11-14: FALSIFIKAT EINGETRETEN, erste Haelfte, VERWORFEN. Die USTR hat die zweimonatige Verlaengerung der Aussetzung der Section-301-Hafengebuehren FINALISIERT - nicht mehr nur vorgeschlagen wie am 2026-10-26: wirksam ab 2026-11-09 bis 2027-01-09 23:59 ET, veroeffentlicht im Federal Register am 2026-11-10 (Public-Inspection-Nummer 2026-22867, Titel ''Section 301 Action: China''s Targeting of the Maritime, Logistics and Shipbuilding Sectors for Dominance''). Erfasst sind die Hafen- und Maritime-Servicegebuehren nach Annexen I, II und III der Bekanntmachung vom 2025-04-23 sowie die Zoelle nach Annex V.A der Bekanntmachung vom 2025-10-16 (STS-Kraene und sonstiges Cargo-Handling-Equipment); die HTS-Positionen 9903.91.12 bis 9903.91.16 sind von ''November 10, 2026'' auf ''January 10, 2027'' umgeschrieben. Quellen: Holland & Knight Alert 2026-11-09, gcaptain.com 2026-11-10 (''formally extended''), Abruf 2026-11-14. NACHRUF: Gedacht war, dass die am 2026-11-10 auslaufende
    Aussetzung die Gebuehren auf chinesisch gebaute Tonnage wieder scharf macht und Nicht-China-Flotten einen datierten Kostenvorteil bekommen. Passiert ist das Gegenteil - die Aussetzung wurde zwei Tage vor dem Termin final um zwei Monate verlaengert, der Treiber ist um 60 Tage verschoben und steht jetzt am 2027-01-09. Gelernt: bei Fristen, die an einer laufenden Handels-Truce haengen, ist die Verlaengerung der Normalfall und nicht die Ausnahme; der Lauf vom 2026-11-07 hatte den Vorschlag bereits gefunden und das Falsifikat als ''fast getroffen'' benannt - richtig gemessen, und die Konsequenz war, nicht zu handeln. Kein Kapital gebunden, kein Verlust.'
