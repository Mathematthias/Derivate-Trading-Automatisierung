    - date: '2026-11-03'
      ereignis: ETN Q3 (letzter gesperrter Ausdruck, Earnings-Disqualifier laeuft danach aus)
    - date: '2026-11-11'
      ereignis: 'ENR.DE Q4-FY2026-Call: Auftragseingang Grid Technologies = einziger messbarer Punkt fuer Falsifikat (b), plus erste FY2027-Guidance (Z92)'
    - date: '2026-11-18'
      ereignis: UK CfD AR8 Beschwerdeentscheid - Bieterliste endgueltig, Mengensignal fuer die Lieferkette (Z79)
    - date: '2026-11-24'
      ereignis: Terna MACSE-2-Auktion, rund 16 GWh BESS fuer Lieferjahr 2029 (Z52)
    - date: '2026-11-26'
      ereignis: NL Ausschreibung IJmuiden Ver Gamma A+B, 2 GW, Bewerbungsfenster bis 2026-12-10 (Z63)
    thesen_falsifikat: ENR.DE meldet am 2026-11-11 book-to-bill < 1 in Grid Technologies, ODER ein Big-5-Hyperscaler kuerzt die Capex-Guidance 2026/2027.
    preis_falsifikat:
      symbol: PWR
      op: <
      level: 607.73
      text: EMA200-1D, Stand 2026-10-30. PWR ist der einzige Ausdruck, der Struktur zurueckerobert hat (Kurs 620,73 ueber EMA20 620,08 und EMA200 607,73, RSI 48,9 nach 28,3 in der Vorwoche). Verliert gerade dieser die EMA200 wieder, findet die Neubewertung nicht statt. Je Vehikel zusaetzlich Stop an eigener Struktur.
