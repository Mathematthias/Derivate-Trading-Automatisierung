- id: N3
  titel: Deutscher Kapazitaetsmarkt - Zuschlag 2026-11-03
  verdikt: beobachten
  re_check: '2026-12-12'
  crowdedness_pp: -14.36
  korb_budget_pct: 0
  falsifikat: (a) Die BNetzA verschiebt den gesetzlichen zweiten Gebotstermin 2026-12-29 oder die Ausschreibung bleibt aus, ODER (b) das Zuschlagsvolumen der zweiten Runde bleibt deutlich unter den gesetzlich verbleibenden rund 3.840 rMW, ODER (c) ENR.DE meldet im Q1-FY2027-Bericht (Februar 2027) fuer Gas Services erstmals wieder einen Auftragseingang unter dem Umsatz -> verworfen.
  note: 'THESEN-LAUF 2026-11-14: Re-Check 2026-11-12 hier erledigt, ALTES FALSIFIKAT AN BEIDEN HAELFTEN WIDERLEGT. (a) Der Gebotstermin der zweiten Langzeitkapazitaets-Runde ist nicht unbestimmt, sondern steht im Gesetz selbst: § 4 Abs. 1 StromVKG nennt den 2026-09-08 und den 2026-12-29 (buzer.de, konsolidierte Fassung zu BGBl. 2026 I Nr. 210a); der BDEW bestaetigt am 2026-11-04 ''die Frist fuer die zweite Ausschreibungsrunde endet am 29. Dezember 2026''. Eine gesonderte BNetzA-Bekanntgabe am 2026-11-10 war dafuer nicht erforderlich und ist auch nicht belegt. (b) ENR.DE Q4 FY2026 am 2026-11-11 widerlegt die book-to-bill-Haelfte deutlich: Gas Services Auftragseingang 5,34 Mrd. EUR gegen 4,2 Mrd. Umsatz = book-to-bill 1,3 (von Siemens Energy selbst genannt, Analystenpraesentation Folie 35), Gesamtjahr 32,8 gegen 14,5 Mrd. = 2,26; Grid Technologies Q4 ebenfalls 1,3; Gesamt-Backlog 164 Mrd. EUR Rekord (+26 Mrd.), rund 85 % des FY27-Umsatzes backlog-gedeckt, FY27-Guidance Gas Services 24-26 %
    Umsatzwachstum und 18-20 % Marge. KEINE HOCHSTUFUNG, Gruende unveraendert und nicht an der Handelbarkeit gemessen: (i) die Verguetung beginnt 2031 und eine Inbetriebnahmefrist ist weiter nicht publiziert, der Bestellzeitpunkt bleibt unbestimmt (Gate 2 verlangt eine Kausalkette mit Zeitpunkt); (ii) nach dem Rekordquartal und dem 9-Mrd.-Rueckkauf ist ''Turbinennachfrage zieht an'' kein Abweichungsargument mehr, sondern Konsens (Gate 1); (iii) ein Preis-Falsifikat ist am Allzeithoch nicht mit benennbarer Struktur konstruierbar, und die Crowdedness war in diesem Lauf nicht messbar (keine Kursquelle im Container). Falsifikat auf die naechsten datierten Punkte umgestellt.'
