- id: N5
  titel: SpaceX-Lockup-Vollablauf 2026-12-09
  verdikt: beobachten
  re_check: '2026-11-28'
  crowdedness_pp: null
  korb_budget_pct: 0
  falsifikat: Lockup wird verlaengert oder per Waiver aufgehoben, ODER der Kurs schliesst in den fuenf Handelstagen nach 2026-12-09 hoeher als am 2026-12-08 (Angebot absorbiert) -> verworfen
  note: 'THESEN-LAUF 2026-11-21: Re-Check 2026-11-28 nicht faellig, keine Verdiktaenderung. Der Ablauftag ist bestaetigt: tickerlaunch.com fuehrt SPCX mit Lockup-Ablauf 2026-12-08, IPO 2026-06-11, 180 Tage, Staffelung (Abruf 2026-11-21), uebereinstimmend mit der Radar-Zeile 2026-12-08; stockanalysis.com fuehrt SPCX zusaetzlich unter ''Conditional'' mit 1,06 Mrd. Stueck ohne festes Datum. Liegt im 28-Tage-Fenster, siehe Abschnitt B. STRUKTURBEFUND, der schwerer wiegt als der Termin: die Wirkungsrichtung der These ist ''Angebotsueberhang drueckt den Kurs'', also short. Unter der Regel ''Keine Shorts'' (Backtest 2026-11-07) kann sie in dieser Form nie eine Karte werden, unabhaengig von Crowdedness und Vehikel. Dazu passt das heute gemessene Ergebnis von N12 (CBRS schloss an allen fuenf Handelstagen nach dem Lockup-Ablauf hoeher als am Vortag). Die nutzbare Lesart ist die Umkehrung - Kauf nach absorbiertem Ueberhang -, sie laeuft ab diesem Lauf als eigener Kandidat LUABS. N5 bleibt bis zum 2026-12-08
    als Messpunkt fuer genau diese Frage stehen und wird danach entweder ueber sein Falsifikat geschlossen oder in LUABS aufgeloest. Crowdedness nicht messbar (fehler: keine Ausdruecke); SPCX wird bewusst NICHT als Ausdruck eingetragen, weil der Ruestungsumsatzanteil von SpaceX (Starshield, NRO- und Space-Force-Starts) in dieser Umgebung nicht belegbar unter 30 % liegt und der Ethik-Ausschluss sonst umgangen wuerde.'
