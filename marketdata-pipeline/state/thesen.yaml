  ausdruecke: []
  note: 'NEU, Thesen-Lauf 2026-10-31. Kandidat aus GRUPPE 2 (Vergabe- und Auktionstermine; Radar Z52). Treiber: Terna fuehrt am 2026-11-24 ab 10:00 die zweite MACSE-Auktion (Mercato a Termine dello Stoccaggio) fuer das Lieferjahr 2029 durch, ausgeschrieben rund 16 GWh neue Batteriespeicherkapazitaet nach 10 GWh in der Vorrunde. Kausalkette: der Zuschlag begruendet 15-jaehrige indexierte Kapazitaetsvertraege, also eine vertraglich fixierte BESS-Bestellmenge in Italien mit Lieferziel 2029 - Mengenwirkung fuer Zellen, Container, Umrichter und Netzanschluss, unabhaengig vom Strompreis. 4b: gerichtet erfuellt (long Speicher-Lieferkette und italienische Netz-/Versorger-Seite), mechanisch-direkt erfuellt (Zuschlagsmenge = Auftragsmenge), falsifizierbar erfuellt. WORAN ES HEUTE HAENGT: KEIN BENANNTER WERT IST IM UNIVERSUM - TRN.MI, ENEL.MI, A2A.MI, IRE.MI, ERG.MI und FLNC fehlen alle, Crowdedness damit nicht messbar und ausdruecke leer. Nach der Reform vom 2026-08-04 ist das eine Vehikelfrage und
