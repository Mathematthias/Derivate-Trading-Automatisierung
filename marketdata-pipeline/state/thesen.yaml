  note: 'THESEN-LAUF 2026-11-21: VERWORFEN, PREIS-/THESEN-FALSIFIKAT EINGETRETEN (Re-Check 2026-11-17 war ueberfaellig und ist hier erledigt). NACHRUF: Gedacht war, der Vollablauf des Cerebras-IPO-Lockups am 2026-11-09/10 setze eine Resttranche frei und druecke den Kurs. Passiert ist das Gegenteil, und zwar in beiden Datumslesarten eindeutig: Lesart Ablauf 2026-11-09 (Prospekt vom 2026-05-13 plus 180 Tage, FinanceFeeds 2026-11-09) - Vortagesschluss Fr 2026-11-06 89,68 USD, danach 10.11. 93,66 / 11.11. 101,08 / 12.11. 97,75 / 13.11. 108,72 / 16.11. 100,99, alle fuenf hoeher, Hoechstschluss +21,2 %; Lesart Ablauf 2026-11-10 - Vortagesschluss 2026-11-09 96,70, danach 101,08 / 97,75 / 108,72 / 100,99 / 104,18, ebenfalls alle fuenf hoeher. Damit ist die Falsifikat-Haelfte ''CBRS schliesst in den fuenf Handelstagen nach dem Ablauftag hoeher als am Vortag (Angebot absorbiert)'' erfuellt. Keine Verlaengerung und kein Waiver in fuenf geprueften Quellen; die Prospekt-Alternative 2026-11-16 (zweiter
    Handelstag nach Q3) kam nicht zum Tragen, weil der fruehere Termin griff. Der Abverkauf lag VOR dem Termin: 2026-11-05 Schluss 81,71 USD, der tiefste Schlusskurs der letzten zwoelf Monate, intraday 77,84, Tagesverlust rund -11 %. GELERNT, und das ist die wertvollste Zeile dieses Laufs: der Lockup-Ablauf ist kein Verkaufsanlass, sondern der Zeitpunkt, an dem der Ueberhang bereits im Kurs steht - die Front-Running-Verkaeufer handeln die Tage DAVOR. In einem Long-only-System ist die ganze Lockup-Familie damit nur als Kauf nach absorbiertem Ueberhang spielbar, nicht als Short auf das Datum. Daraus entsteht der Kandidat LUABS; auch N5 (SpaceX 2026-12-08) ist nach diesem Befund als Short-Mechanik strukturell kartenunfaehig. Zweite Lehre: n=1. Vor einer Karte braucht LUABS einen Backtest ueber mehrere Lockups. Quellen: quiverquant.com/stock/CBRS/historical-prices, financefeeds.com 2026-11-09, financebuzz.com 2026-11-10, trefis.com 2026-11-16, boerse-express.com, trading-treff.de 2026-11-06,
    alle Abruf 2026-11-21. Kurs am 2026-11-20 rund 82,67 USD (kein offizieller Schluss belegt, globalbankingandfinance.com), rund 55 % unter dem IPO-Preis 185,00.'
