  karte:
    konsens: 'Der Markt bestraft AI-Capex als Kostenblock statt sie als Auftragseingang zu lesen: die vier Ausdruecke liegen 30d zwischen -6,3 % (PWR) und -15,4 % (ETN), ETN/ABBN.SW/PRY.MI unter allen vier EMAs, Abstand zum 52W-Hoch -20,7 bis -29,8 %; Sektor-Linse Halbleiter als verwandter Komplex median -34,1 % zum 52W-Hoch (Digest 2026-10-30).'
    abweichung: Die Capex wird nicht gekuerzt, sondern erhoeht - alle vier Big-5-Berichte Ende Oktober ohne Cut (META 10-21 angehoben, Alphabet 10-28 gehalten plus 2027-Anstieg, AMZN 10-30 Q3 77,3 Mrd. USD und 2027 'meaningfully more'). Auf der Lieferseite hat Prysmian am 2026-10-29 die FY26-Guidance zum zweiten Mal erhoeht, 16,5 Mrd. EUR Backlog gemeldet und die 2028er Ziele zwei Jahre vorgezogen. Auftragsseite beschleunigt, Kurse de-raten.
