    source: thesen-lauf
- id: N3
  titel: Deutscher Kapazitaetsmarkt - Zuschlag 2026-11-03
  verdikt: beobachten
  re_check: '2026-11-06'
  crowdedness_pp: null
  korb_budget_pct: 0
  falsifikat: Zuschlagsvolumen am 2026-11-03 deutlich unter den ausgeschriebenen 4.500 MW ODER Gasturbinen-/Neubauanteil im Zuschlag marginal (Schwerpunkt Bestandsanlagen) -> verworfen
  note: 'Kandidat aus Gruppe 2 (Vergabe-/Auktionstermine, Radar Z66). Erste deutsche Kapazitaetsmarkt-Auktion nach StromVKG, Gebotsschluss war 2026-09-08, Zuschlagsbekanntgabe 2026-11-03, 4.500 MW, Hoechstpreis 244.000 EUR/MW*a, Vertragslaufzeit 15 Jahre, Batteriespeicher faktisch ausgeschlossen (10-h-Kriterium). Kausalkette: Zuschlagsmenge je Technologie -> gesicherter Auftragsbestand im Gasturbinen-/Kraftwerksbau. Nur ENR.DE im Universum (145,36 EUR, 30d +3,22 %, Stack neutral, Q4-Zahlen 2026-11-11); UN01.DE und RWE.DE nicht gefuehrt, Crowdedness daher nicht belastbar messbar. Quelle: bundesnetzagentur.de / boersen-zeitung.de, Abruf 2026-08-04; Split der Zeile 2026-09-07.'
