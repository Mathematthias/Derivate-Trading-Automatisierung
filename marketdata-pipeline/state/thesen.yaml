    story: 'XLK fiel vom 52W-Hoch 202,00 USD auf 164,74 USD (Schluss 2026-11-06, -18,4 %), davon -4,9 % am 2026-10-30 und -8,0 % am 2026-11-05 (162,38 USD, -19,6 %, 0,78 USD ueber der Marke). Ausloeser laut Reuters/DJ: Midterm-Sieg der Demokraten und Sorge um neue Rechenzentren, schwache Ausblicke von Qualcomm und Arm, Zweifel an der Finanzierung des AI-Capex, zuletzt eine zu 78 % eingepreiste Zinserhoehung im Dezember. Die Gewinne brachen dabei nicht ein: S&P-IT Q3 94 % Beats und +69,2 % Gewinnwachstum, Forward-KGV 17,3 gegen 25-Jahres-Schnitt 20,0 (FactSet 2026-11-06). Es ist eine reine Tech-Korrektur: S&P 500 nur -5,6 % zum Hoch, XLK -12,3 % gegen SPY in 21 Tagen. Quellen: trading/TDIP_Einstieg_Analyse_2026-11-09.md.'
    gegenthese: 'Staerkstes Gegenargument: Billig ist die Bewertung nur, wenn die Gewinnschaetzungen fuer 2027 halten; der Markt zweifelt genau daran (AI-Capex 2027 laut BofA 1,2 Bio. USD bei Free Cashflow -180 Mrd. USD, Rechenzentren-Politik, Zinsen). Historisch liefen reine Tech-Korrekturen klar schlechter als breite: bei -20 % ab 2003 im Mittel +8,7 % gegen +26,1 % nach 6 Monaten. Nach einem Erholungstag knapp vor -20 % kam -20 % in 19 von 25 Faellen doch noch. Teilweise eingepreist durch das tiefe Forward-KGV, aber nicht klar schwaecher als die These.'
