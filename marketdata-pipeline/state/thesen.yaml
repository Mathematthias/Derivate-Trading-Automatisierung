  falsifikat: HRC Nordeuropa unter 745 EUR/t am 2026-11-12 (Referenz 745 EUR/t Stand 2026-09-28)
  ausdruecke: []
  note: 'Re-Check faellig heute, Verdikt von beobachten auf spielen. Konviktions-Gate 4b alle drei harten Kriterien erfuellt (gerichtet long EU-Produzenten, Kausalkette Importvolumen->EU-Preisniveau->Marge, Falsifikat datiert). Preisseite hat gedreht: HRC Nordeuropa 740-750 EUR/t DDP, Werksabschluesse 745-760 (SMM 2026-10-09), Mills heben Angebote, Kaeuferlager niedrig, Restocking ab November = genau im Messfenster. Kurs-Katalysator 2026-10-09: UBS Neutral->Buy, Kursziel 56->71 EUR, SZG.DE Schluss 49,94 EUR +13,40 %, MT.AS +4,6 %. Crowdedness 30d SZG.DE -5,26 / MT.AS -9,92 PP, Mittel -7,59 PP (Vorwoche -11,84) -> Zone <10, Raum vorhanden, Korb 3 % RK. ACHTUNG: kein Ausdruck heute konstruierbar, beide Namen unter EMA20 mit neutralem Stack (SZG 49,94 vs EMA20 50,21; MT 57,28 vs 59,64) - Ausdruecke entscheidet Matthias im Chat. Ethik: SZG.DE, MT.AS, ACX.MC, APAM.AS frei; TKA.DE wegen TKMS-Mehrheit ausgeschlossen bis 30-%-Pruefung.'
