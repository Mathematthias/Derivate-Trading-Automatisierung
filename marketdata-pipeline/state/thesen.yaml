- id: STAHL
  titel: EU-Stahl melt-and-pour
  verdikt: beobachten
  korb_budget_pct: null
  crowdedness_pp: -0.02
  re_check: '2026-12-12'
  falsifikat: Fastmarkets-Tagesindex 'hot-rolled coil index domestic, exw Northern Europe' schliesst auf oder unter 745,00 EUR/t - ein einziger Indexwert beendet die These sofort, ohne auf den Re-Check zu warten (Basis EXW, nicht DDP, nicht Italien, nicht Zentraleuropa). ODER die EU setzt die Verschaerfung der Stahl-Schutzquoten ueber die zweite Jahreshaelfte 2027 hinaus aus bzw. loest die melt-and-pour-Bindung.
  ausdruecke:
  - SZG.DE
  - MT.AS
  - VOE.VI
  note: 'THESEN-LAUF 2026-11-14: VERDIKT KORRIGIERT spielen -> beobachten. Das war der am 2026-11-07 fuer den 2026-11-13 angekuendigte Entscheid ''Karte schreiben oder Verdikt korrigieren''. FALSIFIKAT NICHT EINGETRETEN, Praemisse sogar gestaerkt: HRC Nordeuropa EXW 770,83 EUR/t am 2026-11-12 (Fastmarkets-Tagesindex via eurometal.net, veroeffentlicht 2026-11-13, Abruf 2026-11-14), gestiegen von 764,38 am 2026-11-11 und von 762,50 am 2026-11-10 - der Abstand zu 745 ist +25,83 EUR/t; Italien EXW 772,71; Zentraleuropa-Wochenband 735-755 (enthaelt 745, gehoert aber nicht zur Messreihe). Salzgitter Q3 am 2026-11-12 bestaetigt: EBITDA 200 Mio. EUR gegen 154 Mio. Konsens, FY26-Guidance EBITDA von 725-825 auf 800-875 Mio. EUR und EBT von 325-425 auf 400-475 Mio. EUR angehoben, Umsatz rund 10 Mrd. EUR, P28-Programm 146 gegen 122 Mio. Ziel; Werke fordern Preiserhoehungen fuer Q1 2027 (de.investing.com 2026-11-12, eurometal.net 2026-11-13). GRUND DER KORREKTUR ist NICHT der Kursverlauf und NICHT die
    Faktenlage, sondern dass die Thesen-Karte nicht vollendbar ist: das Pflichtfeld katalysator braucht ein Datum binnen 6 Monaten (Gate 2), und der entscheidende regulatorische Treiber ist nach Aussage des Unternehmens selbst die protektionistischere EU-Stahlquote ''ab der zweiten Jahreshaelfte 2027'' - das liegt rund acht Monate voraus. Die naechsten datierten Unternehmenstermine sind die FY2026-Zahlen im Maerz 2027. Nach derselben Regel, die OEL am 2026-11-07 herabgestuft hat, bleibt eine These ohne vollstaendige Karte bei beobachten; ''spielen'' ohne Karte war folgenlos und hat seit dem 2026-10-31 einen der zwei Plaetze der Spur blockiert. korb_budget_pct von 3 auf null (Korb-Klasse am 2026-10-29 abgeloest). CROWDEDNESS in diesem Lauf nicht messbar (keine Kursquelle im Container, HTTP 403 am Proxy fuer Yahoo und sechs weitere Endpunkte); letzter belegter Wert -0,02 PP vom 2026-11-07.'
