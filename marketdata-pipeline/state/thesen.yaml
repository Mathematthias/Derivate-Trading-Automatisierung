  note: 'THESEN-LAUF 2026-11-14: FALSIFIKAT EINGETRETEN, BEIDE HAELFTEN, VERWORFEN. Die USTR hat die 178 Section-301-Produktausnahmen bis zum 2027-01-09 verlaengert, und die 14 Ausnahmen fuer Solarfertigungs-Equipment sind ausdruecklich enthalten (Shanghai Metals Market ''US Extends China Section 301 Product Exclusions, Including 14 Solar Manufacturing Equipment Items''; Mohawk Global ''USTR Extends 178 Section 301 Tariff Exclusions Through January 2027''; EY Tax News 2026-2411; GHY International; Abruf 2026-11-14). Damit sind sowohl die Verlaengerungs-Haelfte als auch die Einzelfortschreibungs-Haelfte des Falsifikats erfuellt. NACHRUF: Gedacht war, dass das Auslaufen der Ausnahmen am 2026-11-10 die Einfuhrkosten fuer US-Solarzellenfertigung sprunghaft erhoeht und den Kapazitaetsaufbau verteuert. Passiert ist eine Verlaengerung im selben Paket wie die Hafengebuehren - derselbe Mechanismus, der N8 getoetet hat, am selben Tag. Gelernt: zwei Thesen, die an derselben Frist derselben Behoerde
