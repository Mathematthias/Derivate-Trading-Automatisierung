  note: 'RE-CHECK 2026-10-24 faellig, hier erledigt. Verdikt spielen unveraendert, Budget 3 % unveraendert, neuer Re-Check 2026-11-13 (Tag nach dem Messtermin Z90). KORREKTUR der Notiz vom 2026-10-17: dort stand HRC Nordwest-Europa 742 EUR/t EXW - das war der ITALIEN-Wert (741,25 EUR/t). Nordeuropa lag in derselben Serie bei 746,88 EUR/t EXW (Woche bis 2026-10-09, metal.com/SMM, veroeff. 2026-10-12) und steht am 2026-10-19 bei 748,75 EUR/t EXW, +3,75 gegen den 2026-10-16 (745,00), +7,08 auf Wochensicht, +11,25 auf Monatssicht (Fastmarkets via eurometal.net, veroeff. 2026-10-20, Abruf 2026-10-24). Das Falsifikat ist damit NICHT erfuellt, sondern der Preis laeuft von der Schwelle weg; Werksangebote 760 EUR/t EXW, deutsche Werke zielen auf 770 EUR/t frei Verwendungsort (netto ca. 750-755 EXW), Lager weiter hoch, Nachfrage schwach. Crowdedness 30d: SZG.DE -15,24 vs ^GDAXI -0,34 = -14,90 PP, MT.AS -14,03 vs ^STOXX50E -3,26 = -10,77 PP, VOE.VI -7,78 vs ^STOXX50E = -4,52 PP, Mittel -10,06 PP (Vorwoche
    -8,98) - Unterperformance, Zonenregel ohne Deckel. Divergenz benannt: der Thesenpreis steigt, die Aktien fallen; nach Schritt 4c ist das Timing und Groesse, keine Thesenfrage. Ausdrucksstand (Digest 2026-10-23 22:33): alle drei unter allen vier EMAs - SZG.DE 43,82 (EMA20 48,11 / EMA200 48,29, RSI 34,0, ATR 5,6 %), MT.AS 53,30 (57,11 / 54,11, RSI 29,8, 0,43 ATR UNTER der EMA200 = Anker der aktiven Korb-Zeile gebrochen), VOE.VI 41,94 (43,85 / 42,40, RSI 37,0). Heute kein Ausdruck platzierbar (Veto #1); Earnings sperren nicht (MT.AS 2026-11-05, VOE.VI 2026-11-11, SZG.DE 2026-11-12).'
