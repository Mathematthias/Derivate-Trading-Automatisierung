    letzter Wert der alten Reihe -8,95 PP vom 2026-11-07; mittelwert_pp (alte Rechnung ohne Indexabzug) -18,17 PP. Klumpen-Hinweis: Ausdruecke VLO/MPC/XOM/PSX liegen im Sektor des Kern-Bestands XLE, Punkt 6 der Checkliste faellt damit - diese These kann in dieser Form keine Karte werden, solange der Kern XLE haelt.'
