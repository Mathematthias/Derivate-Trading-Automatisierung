- id: N13
  titel: Zweite StromVKG-Runde - Volumen schrumpft auf rund 3.840 rMW, Bekanntgabe 2026-11-10
  verdikt: verworfen
  re_check: '2026-11-11'
  crowdedness_pp: null
  korb_budget_pct: 0
  falsifikat: Die BNetzA gibt am 2026-11-10 fuer die zweite Runde ein Volumen von rund 4.500 rMW oder mehr bekannt (dann ist die Ueberzeichnung der ersten Runde nicht gegengerechnet und der Treiber faellt), ODER der Gebotstermin wird nicht auf Dezember 2026 gelegt -> verworfen.
  note: 'THESEN-LAUF 2026-11-14: PRAEMISSE BESTAETIGT, THESE TROTZDEM VERWORFEN (Entscheid dieses Laufs, kein Falsifikat-Treffer). Das Volumen der zweiten StromVKG-Runde ist tatsaechlich gegengerechnet: 5.159,969 rMW Zuschlag in Runde 1 gegen 4.500 rMW ausgeschrieben ergibt nach § 4 Abs. 4 StromVKG rund 3.840,031 rMW fuer Runde 2, Gebotstermin 2026-12-29, 24 Uhr (wirtschaftsjournal.com 2026-11-12 mit der Rechnung; BDEW 2026-11-04 fuer den Termin; § 4 Abs. 1 und 4 StromVKG via buzer.de). Die von photon behauptete Alternative ''jeweils 4,5 GW'' ist damit widerlegt, das Falsifikat NICHT eingetreten. VERWORFEN WIRD SIE AUS DREI GRUENDEN: (i) Die Behauptung ist gerichtet NEGATIV (''die naechste Tranche ist kleiner als die Schlagzeile'') und ihr einziger Ausdruck waere ENR.DE - die Spur handelt nach der Neuaufstellung 2026-11-07 keine Shorts, es gibt also kein zulaessiges Vehikel fuer diese Richtung. (ii) 660 rMW weniger ausgeschriebene Menge sind bei einem Auftragsbestand von 164 Mrd. EUR keine
    bezifferbare Ergebniswirkung (Gate 2). (iii) Der einzige datierte Treiber, die Bekanntgabe am 2026-11-10, ist vorbei; der Gebotstermin 2026-12-29 ist als Radar-Zeile besser gefuehrt als als These. NACHRUF: Gedacht war, die Ueberzeichnung der ersten Runde werde als Mengenkuerzung der zweiten in die Kurse der Turbinenbauer durchschlagen. Gemessen wurde, dass die Kuerzung real eintritt - und dass sie im selben Monat von einem Rekord-Backlog und einer FY27-Guidance von 24-26 % Umsatzwachstum vollstaendig ueberdeckt wird. Gelernt: eine These, deren einzige Ausdrucksrichtung die Spur verbietet, ist beim Anlegen zu verwerfen und nicht erst beim dritten Re-Check.'
