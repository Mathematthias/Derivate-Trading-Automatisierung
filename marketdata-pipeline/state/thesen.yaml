  note: 'NEU, Thesen-Lauf 2026-11-07. Kandidat aus GRUPPE 2 (Vergabe- und Auktionstermine). Gegenstueck zu N3 und ausdruecklich die GEGENLAEUFIGE Behauptung: nicht ''der Kapazitaetsmarkt bringt Turbinenmengen'', sondern ''die naechste Tranche ist kleiner als die Schlagzeile''. Treiber: Die erste Runde hat 5.160 rMW auf 4.500 rMW ausgeschriebene Menge zugeschlagen, weil das Gebot, das das Volumen erstmals ueberschritt, noch bezuschlagt wurde (BNetzA PM 2026-11-03). energiezukunft (2026-11-05) rechnet das Volumen der zweiten Runde deshalb auf ''rund 3.840 rMW'' herunter und nennt den Gebotstermin 2026-12-29; cleanthinking (2026-11-03) nennt ''Ende Dezember'' ohne Tag; photon (2026-11-04) schreibt dagegen ''in den ersten beiden Ausschreibungsrunden werden jeweils 4,5 Gigawatt gefoerdert''. Dieser Widerspruch ist der Kern der These. Kausalkette: 660 rMW weniger ausgeschriebene Menge sind rund 15 % weniger Auftragsvolumen in der naechsten Tranche fuer Gasturbinen-, Gasmotoren- und EPC-Anbieter;
