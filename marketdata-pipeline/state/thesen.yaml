  crowdedness_pp: -22.34
  korb_budget_pct: 0
  falsifikat: China verlaengert die Aussetzung von Announcement 61 vor dem 2026-11-10, ODER MOFCOM bestaetigt itemisiert, dass die SE-Exportkontrollen in der Waffenstillstands-Verlaengerung vom 2026-09-28 bis 2027-01-10 enthalten sind -> verworfen.
  note: 'RE-CHECK 2026-11-06 war ueberfaellig, hier erledigt. Falsifikat NICHT eingetreten, soweit heute belegbar: keine Verlaengerung publiziert; die Aussetzung aus MOFCOM-Announcement 70 vom 2025-11-07 laeuft woertlich ''to November 10, 2026'' und umfasst die Announcements 55, 56, 57, 58, 61 und 62 von 2025 (Global Times 2025-11-07). Die Truce-Verlaengerung bis 2027-01-10 nennt Seltene Erden NICHT (MINING.COM, 2026-11-04, rund sechs Tage vor dem Termin). EINSCHRAENKUNG: die MOFCOM-Primaerquelle ist in diesem Lauf nicht gelesen, und rareearthdirectory.com ist nach eigener Angabe nur bis 2026-10-01 geprueft - eine Verlaengerung nach dem 2026-10-01 kann ich nicht ausschliessen. KEINE Hochstufung auf spielen, gemessen an 4b: Gate 1 ist nur bedingt erfuellt. Die These sagt ''bei Nichtverlaengerung long Nicht-China-Foerderer, short europaeische Magnet-Abnehmer'' - sie sagt nicht, wie die politische Entscheidung am 2026-11-10 ausgeht, und einen Informationsvorsprung darueber habe ich nicht; das
    ist eine Wette auf den Ausgang eines binaeren politischen Ereignisses in drei Tagen, nicht auf eine Fehlbewertung. Gate 2 ist fuer IFX.DE als ''Magnet-Abnehmer'' schwach (Magnetanteil an den Kosten eines Halbleiterherstellers nicht bezifferbar). Nebenbefund, kein Thesenargument: MP 35,41 steht im Digest selbst als breakdown_short-Pitch (bearisch unter allen vier EMAs, RSI 34,2, ATR 7,06 %, 52W-Hoch -53,89 %) und hat ueberhaupt keine sr-Zone unterhalb des Kurses; IFX.DE 45,755 bearisch unter allen vier, Earnings genau am 2026-11-10. CROWDEDNESS: -22,34 PP (Vorwoche -15,72; MP -18,26 gegen ^GSPC -5,00, IFX.DE -26,41 gegen ^GDAXI +4,09), n=2.'
